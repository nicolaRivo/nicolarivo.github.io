/* accordi.js — motore degli accordi: testo sorgente → modello → analisi (numeri romani, diatonico o no).
   Nessun DOM. Un solo modulo: lo usano la pagina dello studente, l'anteprima dell'Hub e i test (node).
   Sorgente real book:   4/4 ||: Fmaj7 | C7 | Dm7 | Bb :||     1. Am7 D7 :||  2. Fmaj7 ||
   Direttive tra graffe: {key: Ab maj "Modulazione a La♭"}  {key: F maj}  {nota: testo}.   Sezioni: [A]  ·  commenti: # riga
   Sorgente testo:       [Fmaj7]Walking home a[C7]long the river      */

const AC_LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
const AC_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const AC_MODES = {
  maj: [0, 2, 4, 5, 7, 9, 11], min: [0, 2, 3, 5, 7, 8, 10], dor: [0, 2, 3, 5, 7, 9, 10], phr: [0, 1, 3, 5, 7, 8, 10],
  lyd: [0, 2, 4, 6, 7, 9, 11], mix: [0, 2, 4, 5, 7, 9, 10], loc: [0, 1, 3, 5, 6, 8, 10]
};
const AC_MODE_ALIAS = { "": "maj", maj: "maj", major: "maj", maggiore: "maj", ion: "maj", m: "min", min: "min", minor: "min", minore: "min", aeo: "min",
  dor: "dor", dorian: "dor", dorico: "dor", phr: "phr", phrygian: "phr", frigio: "phr", lyd: "lyd", lydian: "lyd", lidio: "lyd",
  mix: "mix", mixolydian: "mix", misolidio: "mix", loc: "loc", locrian: "loc", locrio: "loc" };
const AC_MODE_LABEL = { maj: ["maggiore", "major"], min: ["minore", "minor"], dor: ["dorico", "Dorian"], phr: ["frigio", "Phrygian"],
  lyd: ["lidio", "Lydian"], mix: ["misolidio", "Mixolydian"], loc: ["locrio", "Locrian"] };
const AC_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];

const acSym = (s) => s.replace(/(?<=[A-G0-9)])b/g, "♭").replace(/(?<=[A-G0-9)])#/g, "♯");
const acAcc = (n) => (n > 0 ? "#".repeat(n) : "b".repeat(-n));
const acMod12 = (n) => ((n % 12) + 12) % 12;

/* "F maj", "Ab", "Am", "D dor", "F# minore" → { root, tonic, mode, name, scale[ {pc,name} ] } oppure null */
function acParseKey(str) {
  const m = /^\s*([A-G])([#b♯♭]?)\s*([A-Za-zàèéìòù]*)\s*$/.exec(String(str || ""));
  if (!m) return null;
  const mode = AC_MODE_ALIAS[m[3].toLowerCase()];
  if (!mode) return null;
  const acc = m[2] === "#" || m[2] === "♯" ? 1 : m[2] === "b" || m[2] === "♭" ? -1 : 0;
  const tonic = acMod12(AC_PC[m[1]] + acc);
  const li = AC_LETTERS.indexOf(m[1]);
  const scale = AC_MODES[mode].map((iv, i) => {
    const letter = AC_LETTERS[(li + i) % 7], pc = acMod12(tonic + iv);
    const d = ((pc - AC_PC[letter] + 18) % 12) - 6;
    return { pc, name: letter + acAcc(d) };
  });
  const root = m[1] + acAcc(acc);
  return { root, tonic, mode, scale, id: tonic + mode, name: acSym(root) + " " + AC_MODE_LABEL[mode][0], nameEn: acSym(root) + " " + AC_MODE_LABEL[mode][1] };
}

/* "Bbm7b5/Eb" → { raw, root, pcs[], bass, minor, dim, dom, label (resa), suffix (per il numero romano) } oppure null */
function acParseChord(raw) {
  const m = /^([A-G])([#b♯♭]?)([^\/]*?)(?:\/([A-G][#b♯♭]?))?$/.exec(String(raw).trim());
  if (!m) return null;
  const sy = (s) => (s === "♯" ? "#" : s === "♭" ? "b" : s);
  const root = acMod12(AC_PC[m[1]] + (sy(m[2]) === "#" ? 1 : sy(m[2]) === "b" ? -1 : 0));
  let q = m[3].replace(/♭/g, "b").replace(/♯/g, "#").replace(/Δ/g, "maj").replace(/ø/g, "m7b5").replace(/°/g, "dim").replace(/[()]/g, "");
  let minor = false, dim = false, aug = false, sus = 0, six = false;
  if (/^(min|m(?!aj)|-)/.test(q)) { minor = true; q = q.replace(/^(min|m(?!aj)|-)/, ""); }
  if (/^dim/.test(q)) { dim = true; q = q.slice(3); }
  if (/^(aug|\+)/.test(q)) { aug = true; q = q.replace(/^(aug|\+)/, ""); }
  const s = /sus(2|4)?/.exec(q); if (s) { sus = +(s[1] || 4); q = q.replace(s[0], ""); }
  const alts = []; q = q.replace(/([b#])(5|9|11|13)/g, (_, a, n) => { alts.push(a + n); return ""; });
  const addm = []; q = q.replace(/add(9|11|13)/g, (_, n) => { addm.push(+n); return ""; });
  const isMaj = /^(maj|M)(?=\d|$)/.test(q) || /(maj|M)(7|9|11|13)/.test(q);
  const num = /(13|11|9|7|6|5)/.exec(q); const n = num ? +num[1] : 0;
  const nine = /69/.test(q);
  if (q.replace(/maj|M|\d+/g, "") !== "") return null;               // resto non riconosciuto: non è un accordo
  let fifth = dim ? 6 : aug ? 8 : 7;
  const iv = [0, sus === 2 ? 2 : sus === 4 ? 5 : minor || dim ? 3 : 4];
  if (alts.includes("b5")) fifth = 6; if (alts.includes("#5")) fifth = 8;
  iv.push(fifth);
  let seventh = 0;
  if (dim && n >= 7) seventh = 9;
  else if (isMaj && n >= 7) seventh = 11;
  else if (n >= 7) seventh = 10;
  else if (isMaj && n === 0 && /^(maj|M)$/.test(q)) seventh = 0;
  if (n === 6 || nine) { six = true; iv.push(9); }
  if (seventh) iv.push(seventh);
  if (n >= 9 || nine) iv.push(2);
  if (n >= 11) iv.push(5);
  if (n >= 13) iv.push(9);
  addm.forEach((a) => iv.push(a === 9 ? 2 : a === 11 ? 5 : 9));
  alts.forEach((a) => { if (a === "b9") iv.push(1); if (a === "#9") iv.push(3); if (a === "#11") iv.push(6); if (a === "b13") iv.push(8); });
  const pcs = [...new Set(iv.map((i) => acMod12(root + i)))];
  let bass = null;
  if (m[4]) { const b = /^([A-G])([#b♯♭]?)$/.exec(m[4]); bass = acMod12(AC_PC[b[1]] + (sy(b[2]) === "#" ? 1 : sy(b[2]) === "b" ? -1 : 0)); if (!pcs.includes(bass)) pcs.push(bass); }
  const lower = (minor || dim) && !sus;
  let suffix;
  if (dim) suffix = seventh === 9 ? "°7" : n >= 7 ? "ø7" : "°";
  else if (minor && fifth === 6 && n >= 7) suffix = "ø7";
  else if (aug) suffix = "+" + (n >= 7 ? (isMaj ? "maj" : "") + n : "");
  else suffix = (isMaj && n >= 7 ? "maj" : "") + (n ? n : "") + (nine ? "9" : "") + (sus ? "sus" + sus : "") + alts.map(acSym).join("") + addm.map((a) => "add" + a).join("");
  if (isMaj && n === 0 && /^(maj|M)$/.test(q)) suffix = "";
  return { raw: String(raw).trim(), root, pcs, bass, minor, dim, aug, sus, lower, suffix, dom: !minor && !dim && !aug && !sus && seventh === 10 && iv.includes(4),
           maj: !minor && !dim && !aug && !sus && suffix === "",
           label: acSym(String(raw).trim()) };
}

function acNumeral(rel, mode) {
  const sc = AC_MODES[mode];
  let i = sc.indexOf(rel), acc = "";
  if (i < 0) {
    if (mode === "min" && rel === 11) i = 6;                    // sensibile del minore armonico: vii°
    else if (rel === 6 && sc.indexOf(5) >= 0) { i = sc.indexOf(5); acc = "♯"; }
    else if (sc.indexOf(rel + 1) >= 0) { i = sc.indexOf(rel + 1); acc = "♭"; }
    else { i = sc.indexOf(rel - 1); acc = "♯"; }
  }
  return { i, acc };
}

/* Analisi di un accordo nel centro tonale `key`: { roman, dia } */
function acAnalyze(ch, key) {
  const allowed = new Set(key.scale.map((x) => x.pc));
  if (key.mode === "min") allowed.add(acMod12(key.tonic + 11));       // minore: naturale + sensibile armonica
  const dia = ch.pcs.every((p) => allowed.has(p));
  const { i, acc } = acNumeral(acMod12(ch.root - key.tonic), key.mode);
  let num = AC_ROMAN[i]; if (ch.lower) num = num.toLowerCase();
  let roman = acc + num + ch.suffix;
  let fn = dia ? "" : "nd";                                          // "" = diatonico senza funzione colorata
  if (dia && !acc && i === 0) fn = "I";                              // tonica
  else if (dia && !acc && i === 4 && !ch.minor) fn = "V";           // dominante primaria
  if (!dia && (ch.dom || ch.maj)) {                                  // dominante secondaria: V7/x (o V/x se senza settima)
    const tgt = acMod12(ch.root + 5), rel = acMod12(tgt - key.tonic), j = AC_MODES[key.mode].indexOf(rel);
    if (j > 0) {
      const t = acDegreeChord(key, j);
      roman = "V" + (ch.suffix || "") + "/" + (t.lower ? AC_ROMAN[j].toLowerCase() : AC_ROMAN[j]);
      fn = "Vx";
    }
  }
  let res = "";
  if (fn === "V") res = acSym(acDegreeChord(key, 0).triad);                       // V → risolve sulla tonica
  const deg = dia && !acc ? i : -1;
  if (fn === "Vx") { const tj = AC_MODES[key.mode].indexOf(acMod12(acMod12(ch.root + 5) - key.tonic)); res = acSym(acDegreeChord(key, tj).triad); }
  let cat = "nd";                                                    // categoria per colori e testi («Teoria»): M0..M6 / m0..m6, mV, mLT, MXj / mXj, nd
  const p = key.mode === "min" ? "m" : "M";
  if (fn === "Vx") cat = p + "X" + AC_MODES[key.mode].indexOf(acMod12(acMod12(ch.root + 5) - key.tonic));
  else if (dia) cat = key.mode === "min" && acMod12(ch.root - key.tonic) === 11 ? "mLT" : key.mode === "min" && fn === "V" ? "mV" : p + i;
  return { roman, dia, fn, deg, res, mode: key.mode, cat, kobj: key };
}

/* Segnaposto nei testi: [ii] = triade del grado nella tonalità, [ii7] = quadriade. Nel minore [V] = dominante armonica, [vii] = sensibile. */
function acFill(text, key) {
  if (!key) return String(text);
  return String(text).replace(/\[([IiVv]{1,4})(7)?\]/g, (m, r, sev) => {
    const j = AC_ROMAN.indexOf(r.toUpperCase()); if (j < 0) return m;
    const up = r === r.toUpperCase();
    if (key.mode === "min" && j === 4 && up) return acSym(key.scale[4].name + (sev ? "7" : ""));
    if (key.mode === "min" && j === 6 && !up) return acSym(acNote(key, 11) + (sev ? "dim7" : "dim"));
    const d = acDegreeChord(key, j); return acSym(sev ? d.seventh : d.triad);
  });
}

/* Accordo costruito per terze sul grado j della scala: { triad, seventh, lower, roman } */
function acDegreeChord(key, j) {
  const sc = key.scale, at = (k) => sc[(j + k) % 7].pc, root = sc[j];
  const t3 = acMod12(at(2) - root.pc), t5 = acMod12(at(4) - root.pc), t7 = acMod12(at(6) - root.pc);
  const tri = t3 === 4 && t5 === 7 ? "" : t3 === 3 && t5 === 7 ? "m" : t3 === 3 && t5 === 6 ? "dim" : t3 === 4 && t5 === 8 ? "aug" : "?";
  const sev = tri === "" ? (t7 === 11 ? "maj7" : "7") : tri === "m" ? (t7 === 10 ? "m7" : "m(maj7)") : tri === "dim" ? (t7 === 9 ? "dim7" : "m7b5") : (t7 === 11 ? "aug(maj7)" : "aug7");
  const lower = tri === "m" || tri === "dim";
  const sfx = tri === "dim" ? "°" : tri === "aug" ? "+" : "";
  return { triad: root.name + tri, seventh: root.name + sev, lower, roman: (lower ? AC_ROMAN[j].toLowerCase() : AC_ROMAN[j]) + sfx };
}

/* Tabella dei diatonici di un centro tonale (più le righe «armoniche» per il minore) */
function acDiatonic(key) {
  const rows = key.scale.map((_, j) => acDegreeChord(key, j));
  const out = rows.map((r) => ({ roman: r.roman, triad: acSym(r.triad), seventh: acSym(r.seventh) }));
  if (key.mode === "min") {
    const v = key.scale[4].name, lt = acNote(key, 11);
    out.push({ roman: "V", triad: acSym(v), seventh: acSym(v + "7"), harm: true });
    out.push({ roman: "vii°", triad: acSym(lt + "dim"), seventh: acSym(lt + "dim7"), harm: true });
  }
  return out;
}
function acNote(key, semis) {          // nome della nota a `semis` semitoni dalla tonica, con la grafia della tonalità (sensibile = settimo grado alzato)
  const l = key.scale[6], pc = acMod12(key.tonic + semis), letter = l.name[0], d = ((pc - AC_PC[letter] + 18) % 12) - 6;
  return letter + acAcc(d);
}

/* ---------- contesto: l'elenco dei centri tonali, condiviso dal real book e dal testo ---------- */
const acT = (it, en) => (typeof LANG !== "undefined" && LANG === "it" ? it : en);      // LANG è del player; nei test vale l'inglese
function acContext(mainKey) {
  const ctx = { keys: [], errors: [], cur: -1 };
  ctx.addKey = (str, line) => {
    const k = acParseKey(str);
    if (!k) { ctx.errors.push({ line, msg: acT("Tonalità non valida: ", "Invalid key: ") + str }); return -1; }
    let i = ctx.keys.findIndex((x) => x.id === k.id);
    if (i < 0) { ctx.keys.push(k); i = ctx.keys.length - 1; }
    return i;
  };
  if (mainKey && String(mainKey).trim()) ctx.cur = ctx.addKey(mainKey, 0);
  return ctx;
}

function acDirective(text, ctx, seen, line) {
  const m = /^\{\s*([A-Za-zàè]+)\s*:\s*(.*?)\s*\}$/.exec(text);
  if (!m) { ctx.errors.push({ line, msg: acT("Direttiva non valida: ", "Invalid directive: ") + text }); return null; }
  const name = m[1].toLowerCase();
  if (name === "key" || name === "tonalita" || name === "tonalità") {
    const mm = /^(.*?)(?:\s+"([^"]*)")?$/.exec(m[2]);
    const idx = ctx.addKey(mm[1], line);
    if (idx < 0) return null;
    const k = ctx.keys[idx];
    const label = mm[2] !== undefined ? mm[2] : (seen.has(idx) ? acT("Ritorno a ", "Back to ") : acT("Modulazione a ", "Modulation to ")) + acT(k.name, k.nameEn);
    return { key: idx, mod: ctx.cur < 0 ? "" : label };
  }
  if (name === "nota" || name === "note") return { note: m[2] };
  ctx.errors.push({ line, msg: acT("Direttiva sconosciuta: ", "Unknown directive: ") + name });
  return null;
}

function acBindChord(word, ctx, line) {
  if (AC_NC.test(String(word).trim())) return { raw: "N.C.", label: "N.C.", nc: true };
  const parts = String(word).split("~");               // Bbm6~min~"prestito dal minore"  (i testi tra virgolette sono già segnaposto ~#N)
  const ch = acParseChord(parts[0]);
  if (!ch) { ctx.errors.push({ line, msg: acT("Accordo non riconosciuto: ", "Chord not recognised: ") + parts[0] }); return { raw: parts[0], label: parts[0], bad: true }; }
  parts.slice(1).forEach((t) => {
    if (/^(min|maj|dom)$/.test(t)) ch.tag = t;
    else if (/^#\d+$/.test(t) && ctx.notes[+t.slice(1)] !== undefined) ch.hint = ctx.notes[+t.slice(1)];
    else ctx.errors.push({ line, msg: acT("Segno sconosciuto dopo l'accordo: ~", "Unknown mark after the chord: ~") + t });
  });
  return ch;
}

/* ---------- real book ---------- */
/* Posizione degli accordi nella battuta. Senza «@» gli accordi si dividono lo spazio in parti uguali (explicit = false).
   Con «@N» (N = battito, anche N.5 per l'ottavo dopo: «C7@4.5» è un push) la battuta si disegna con le barre ritmiche. */
function acPlace(chords, beats, ctx) {
  const explicit = chords.some((c) => c.beat !== undefined);          // «at» c'è sempre; solo con «@» la battuta si disegna con le barre ritmiche
  let prev = 0;
  chords.forEach((c, i) => {
    let at = c.beat !== undefined ? c.beat : (i === 0 ? 1 : Math.floor(i * beats / chords.length) + 1);
    if (at < 1 || at >= beats + 1) { ctx.errors.push({ line: c.line, msg: acT("Battito fuori dalla battuta (", "Beat outside the bar (") + at + "/" + beats + "): " + (c.raw || c.label) }); at = Math.min(Math.max(at, 1), beats + 0.5); }
    if (i > 0 && at <= prev) { ctx.errors.push({ line: c.line, msg: acT("Accordi non in ordine di battito: ", "Chords not in beat order: ") + (c.raw || c.label) }); at = prev + 0.5; }
    c.at = prev = at;
  });
  return explicit;
}

function acParseChart(src, ctx) {
  const bars = [], seen = new Set();
  let buf = [], ending = 0, ts = "", curTs = "", rsNext = false, nextKey = null, nextMod = "", nextNote = "", section = "", breakRow = true;
  const closeBar = (re) => {
    if (!buf.length) { if (re && bars.length) bars[bars.length - 1].re = true; return; }      // niente battute vuote: la direttiva resta in attesa della prossima
    const key = nextKey !== null ? nextKey : ctx.cur;
    const beats = parseInt(curTs || "4/4", 10) || 4;
    const b = { chords: buf, beats, key, rs: rsNext, re: !!re, end: ending, mod: nextKey !== null ? nextMod : "", note: nextNote, ts, section, newRow: breakRow, n: bars.length + 1 };
    if (nextKey !== null) ctx.cur = nextKey;
    b.explicit = acPlace(b.chords, beats, ctx);
    if (!b.explicit && buf.length > 1 && beats % buf.length) {       // es. 3 accordi in 4/4: da soli non si sa dove cadono, serve @
      b.explicit = true;
      ctx.errors.push({ line: buf[0].line, msg: acT("Battuta " + b.n + ": " + buf.length + " accordi non dividono i " + beats + " battiti in parti uguali, indica i battiti con @ (es. C@1 F@3 G@4)",
        "Bar " + b.n + ": " + buf.length + " chords don't split " + beats + " beats evenly, mark the beats with @ (e.g. C@1 F@3 G@4)") });
    }
    b.ghosts = [];                                                  // push: lo stesso accordo, in grigio, un ottavo prima (nella battuta prima se cade sul battito 1)
    b.chords.forEach((c) => {
      if (!c.push) return;
      const tgt = c.at - 0.5 >= 1 ? b : bars[bars.length - 1];
      if (!tgt) return;                                             // push sul battito 1 della prima battuta: niente da anticipare
      const at = tgt === b ? c.at - 0.5 : tgt.beats + 0.5;
      const clash = tgt.chords.find((x) => x.at === at) || tgt.ghosts.map((g) => g.chord).find((x, i) => tgt.ghosts[i].at === at);
      if (clash) { ctx.errors.push({ line: c.line, msg: acT("Push in conflitto: ", "Push clash: ") + (c.raw || c.label) + acT(" cade sulla stessa «&» di ", " lands on the same & as ") + (clash.raw || clash.label) }); return; }
      tgt.ghosts.push({ chord: c, at }); tgt.explicit = true;
    });
    b.chords.forEach((c) => { if (!c.bad && !c.nc && key >= 0) Object.assign(c, acAnalyze(c, ctx.keys[key])); });
    seen.add(key);
    bars.push(b);
    buf = []; ending = 0; ts = ""; rsNext = false; nextKey = null; nextMod = ""; nextNote = ""; section = ""; breakRow = false;
  };
  const lines = String(src || "").split(/\r?\n/);
  lines.forEach((raw, li) => {
    const line = li + 1, t = raw.trim();
    if (!t) { breakRow = true; return; }
    if (/^(#|\/\/)/.test(t)) return;
    const sec = /^\[(.+)\]$/.exec(t);
    if (sec) { closeBar(); section = sec[1].replace(/^\$\s*/, ""); breakRow = true; return; }
    t.split(/(\|\|:|\|:|:\|\||:\||\|\||\||\{[^}]*\})/).forEach((tok) => {
      if (tok === "" || tok === undefined) return;
      if (tok === "||:" || tok === "|:") { closeBar(); rsNext = true; return; }
      if (tok === ":||" || tok === ":|") { closeBar(true); return; }
      if (tok === "||" || tok === "|") { closeBar(); return; }
      if (tok[0] === "{") {
        const d = acDirective(tok, ctx, seen, line);
        if (d && d.key !== undefined) { nextKey = d.key; nextMod = d.mod; }
        if (d && d.note !== undefined) nextNote = d.note;
        return;
      }
      tok.trim().split(/\s+/).filter(Boolean).forEach((w) => {
        if (/^\d+\/\d+$/.test(w)) { if (w !== curTs) { ts = w; curTs = w; } return; }
        const e = /^(\d)\.(.*)$/.exec(w);
        if (e) { ending = +e[1]; w = e[2]; if (!w) return; }
        let bt, push = false;
        if (w[0] === "<") { push = true; w = w.slice(1); if (!w) return; }            // <F7: push, suonato un ottavo prima ma scritto in questa battuta
        const bm = /@(\d+(?:\.5)?)/.exec(w);
        if (bm) { bt = +bm[1]; w = w.replace(bm[0], ""); }
        const put = (c) => { c.line = line; if (bt !== undefined) c.beat = bt; if (push) c.push = true; buf.push(c); };
        if (w === "%") { const p = bars[bars.length - 1]; buf.push(...(p ? p.chords.map((c) => ({ ...c })) : [])); return; }
        if (/^(N\.?C\.?|tacet|-|\.)$/i.test(w)) { put({ raw: w, label: "N.C.", nc: true }); return; }
        put(acBindChord(w, ctx, line));
      });
    });

      const sm = document.createElement("small"); sm.textContent = L("tap a label to open its box", "tocca una forma per aprirla"); name.append(sm);
      const bands = boxes.flatMap((bx) => [bx, ...bx.copies].map((c) => ({ shape: bx.shape, start: c.start, end: c.end })));
      const all = new Map();
      for (const bx of boxes) for (const c of [bx, ...bx.copies]) for (const n of c.notes) all.set(n.s + ":" + n.f, n);
      neck.className = "gt-neck";
      const svg = gtNeck(boxes, 0, GT_FRETS, { w: 40, notes: [...all.values()], ghost: () => false, degrees, bands, full: true, label: L("Whole fretboard", "Manico intero") });
      svg.querySelectorAll("g[data-shape]").forEach((g) => g.addEventListener("click", () => { index = boxes.findIndex((bx) => bx.shape === g.dataset.shape); full = false; paint(); }));
      neck.replaceChildren(svg);
    } else {
      const bx = boxes[index];
      name.replaceChildren(document.createTextNode(bx.shape + L(" shape", " shape")));
      const sm = document.createElement("small"); sm.textContent = L(`frets ${bx.start}–${bx.end} · ${index + 1} of ${boxes.length}`, `tasti ${bx.start}–${bx.end} · ${index + 1} di ${boxes.length}`); name.append(sm);
      const a = Math.max(0, bx.start - 1), b = Math.min(GT_FRETS, bx.end + 1);
      const inBox = (n) => n.f >= bx.start && n.f <= bx.end;
      const ctx = [];
      for (const c of boxes) for (const n of c.notes) if (n.f >= a && n.f <= b) ctx.push(n);
      const seen = new Map(); for (const n of [...bx.notes, ...ctx]) seen.set(n.s + ":" + n.f, n);
      neck.className = "gt-neck is-box";
      neck.replaceChildren(gtNeck(boxes, a, b, { w: 62, notes: [...seen.values()], ghost: (n) => !inBox(n), degrees, label: `${bx.shape} shape, frets ${bx.start} to ${bx.end}` }));
    }
  }
  prev.onclick = () => { index = Math.max(0, index - 1); paint(); };
  next.onclick = () => { index = Math.min(boxes.length - 1, index + 1); paint(); };
  toggleFull.onclick = () => { full = !full; paint(); };
  toggleDeg.onclick = () => { degrees = !degrees; toggleDeg.setAttribute("aria-pressed", String(degrees)); paint(); };
  root.addEventListener("keydown", (e) => { if (full) return; if (e.key === "ArrowLeft") prev.click(); else if (e.key === "ArrowRight") next.click(); });
  paint();
  return root;
}

/* ---------- accordi: real book ---------- */
/* Legatura del push: un arco sopra il simbolo grigio fino allo stesso accordo vero. Si disegna dopo l'impaginazione (serve misurare);
   se l'accordo vero è su un'altra riga della griglia, restano due mezzi archi: uscita a destra e entrata a sinistra. */
function risTies(wrap, ties, chordEl) {
  const old = wrap.querySelector(".rb-ties"); if (old) old.remove();
  const wr = wrap.getBoundingClientRect(); if (!wr.width || !ties.length) return;
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "rb-ties"); svg.setAttribute("width", wr.width); svg.setAttribute("height", wr.height);
  const arc = (x1, x2, y) => { const p = document.createElementNS(NS, "path"); const h = Math.min(11, 5 + Math.abs(x2 - x1) / 6);
    p.setAttribute("d", "M" + x1 + "," + y + " C" + x1 + "," + (y - h) + " " + x2 + "," + (y - h) + " " + x2 + "," + y); svg.appendChild(p); };
  ties.forEach(([g, chord]) => {
    const t = chordEl.get(chord), gb = g.querySelector("b"), tb = t && t.querySelector("b"); if (!gb || !tb) return;
    const a = gb.getBoundingClientRect(), b = tb.getBoundingClientRect();
    const ax = a.left + a.width / 2 - wr.left, ay = a.top - wr.top, bx = b.left + b.width / 2 - wr.left, by = b.top - wr.top;
    if (Math.abs(ay - by) < 24) arc(ax, bx, Math.min(ay, by) - 1);
    else { arc(ax, ax + 28, ay - 1); arc(bx - 28, bx, by - 1); }
  });
  wrap.appendChild(svg);
}

function risBars(model, view, tip) {
  const wrap = risEl("div", "rb");
  if (!model.bars.length) return wrap;
  const sig = model.bars[0].ts || "4/4";
  const chordEl = new Map(), ties = [];
  model.bars.forEach((b, idx) => {
    if (b.section || (idx === 0)) {
      const h = risEl("div", "rb-sec", b.section || ""); h.hidden = !b.section; wrap.appendChild(h);
    }
    const bar = risEl("div", "rb-bar k" + (b.key < 0 ? "n" : b.key % 4));
    if (b.rs) bar.classList.add("rs"); if (b.re) bar.classList.add("re"); if (b.fin) bar.classList.add("fin");
    if (b.end) bar.classList.add("end" + b.end);
    bar.dataset.n = b.n;
    bar.appendChild(risEl("i", "rb-n", b.n));
    if (idx === 0 || b.ts) bar.appendChild(risEl("span", "rb-ts", b.ts || sig));
    if (b.mod) bar.appendChild(risEl("span", "rb-mod", b.mod));
    if (b.end && (idx === 0 || model.bars[idx - 1].end !== b.end)) bar.appendChild(risEl("span", "rb-end", b.end + "."));
    const cs = risEl("div", "rb-cs" + (b.explicit ? " rb-x" : ""));
    if (!b.explicit) cs.style.setProperty("--k", Math.max(b.chords.length, 1));   // un accordo per parte, tutti sulla stessa riga
    b.chords.forEach((c) => {
      const e = risEl("span", "rb-c" + (c.bad ? " bad" : ""));
      e.appendChild(risChordFill(risEl("b"), c.bad ? c.raw : c.label || c.raw));
      if (c.roman) e.appendChild(risEl("small", "", c.roman));
      if (b.explicit) e.style.left = ((c.at - 1) / b.beats * 100) + "%";           // battuta con ritmo armonico insolito: accordo sul suo battito
      risWire(e, c, view, tip);
      cs.appendChild(e); chordEl.set(c, e);
    });
    (b.ghosts || []).forEach((g) => {                                               // push: lo stesso accordo, in grigio, che finisce dove comincia quello vero (legato da un arco)
      const e = risEl("span", "rb-c ghost"); e.appendChild(risChordFill(risEl("b"), g.chord.label || g.chord.raw));
      if (g.at > b.beats) e.classList.add("last"); else e.style.right = "calc(" + ((1 - (g.at + 0.5 - 1) / b.beats) * 100) + "% + 3px)";
      cs.appendChild(e); ties.push([e, g.chord]);
    });
    if (b.explicit) {                                                               // barre ritmiche: una per battito
      const sl = risEl("div", "rb-sl"); sl.style.gridTemplateColumns = "repeat(" + b.beats + ", 1fr)";
      for (let i = 0; i < b.beats; i++) { const s = risEl("i", "", "/"); s.appendChild(risEl("small", "", i + 1));
        if (b.chords.some((c) => c.at === i + 1.5)) s.appendChild(risEl("em", "rb-and", "&"));      // accordo sulla «&» di questo battito
        else if ((b.ghosts || []).some((g) => g.at === i + 1.5)) s.appendChild(risEl("em", "rb-and rb-pl" + (i + 1.5 > b.beats ? " last" : ""), "push"));
        sl.appendChild(s); }
      cs.appendChild(sl);
    }
    bar.appendChild(cs);
    if (b.note) bar.appendChild(risEl("span", "rb-note", b.note));
    wrap.appendChild(bar);

  if (ties.length && typeof ResizeObserver !== "undefined") new ResizeObserver(() => risTies(wrap, ties, chordEl)).observe(wrap);      // scatta anche quando la scheda diventa visibile
  return wrap;
}

function risLyrics(model, view, tip) {
  const wrap = risEl("div", "rl");
  let lastGap = true;                                                           // righe vuote di fila = un solo stacco
  model.lyrics.forEach((l) => {
    if (l.gap) { if (!lastGap) wrap.appendChild(risEl("div", "rl-gap")); lastGap = true; return; }
    lastGap = false;
    if (l.section) { wrap.appendChild(risEl("div", "rl-sec", l.section)); return; }
    const blank = (x) => !(x.text || "").trim();
    const onlyChords = l.segs.some((x) => x.chord) && l.segs.every((x) => x.mod || blank(x));      // riga di soli accordi (nessuna parola): niente riga di testo sotto
    const p = risEl("p", "rl-line" + (onlyChords ? " oc" : l.segs.some((x) => x.chord && !x.inline) ? " hasch" : ""));
    l.segs.forEach((s) => {

async function risFileUrl(f) {
  if (risUrls[f.id]) return risUrls[f.id];
  const res = await fetch(f.file);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const plain = await decryptBytes(cryptoKey, new Uint8Array(await res.arrayBuffer()));
  risUrls[f.id] = URL.createObjectURL(new Blob([plain], { type: f.mime }));
  return risUrls[f.id];
}
function risLightbox(url, nome) {
  const o = risEl("div", "rx-light"); o.setAttribute("role", "dialog"); o.setAttribute("aria-label", nome);
  const img = risEl("img"); img.src = url; img.alt = nome;
  const x = risEl("button", "rx-close", "✕"); x.setAttribute("aria-label", tr("risClose"));
  const close = () => { o.remove(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") close(); };
  o.onclick = (e) => { if (e.target !== img) close(); }; x.onclick = close;
  document.addEventListener("keydown", esc);
  o.append(img, x); document.body.appendChild(o); x.focus();
}
function risFiles(files) {

}

async function tryUnlock(pw) {
  if (DEBUG && pw && !DBG.unlock) DBG.unlock = dbgNow();
  return openWithPassword(pw, async (regular) => {
    const a = performance.now();
    const key = await deriveKey(regular);
    const b = performance.now();
    const meta = JSON.parse(new TextDecoder().decode(await decryptBytes(key, base64Bytes(ENC_META))));
    if (DEBUG) { DBG.kdf = Math.round(b - a); DBG.meta = Math.round(performance.now() - b); }
    return { key, meta, pw: regular };
  }, PASSPARTOUT, SALT, base64Bytes);
}

const PW_KEY = "stems-pw:" + location.pathname;     // one remembered password per page
function remember(pw) { try { localStorage.setItem(PW_KEY, pw); } catch (e) {} }
function forget() { try { localStorage.removeItem(PW_KEY); } catch (e) {} }

function showGate(msg) {
  $("gateWait").hidden = true;
  $("gateForm").hidden = false;
  $("gateErr").hidden = !msg;
  $("gateErr").textContent = msg || "";
  try { $("pw").focus(); } catch (e) {}
}

$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("pw").value;
  $("openBtn").disabled = true; $("openBtn").textContent = tr("opening");
  const r = await tryUnlock(pw);
  $("openBtn").disabled = false; $("openBtn").textContent = tr("open");
  if (!r) { showGate(tr("badPw")); $("pw").select(); return; }
  if ($("rememberPw").checked) remember(r.pw); else forget();
  startPlayer(r.meta, r.key, r.pw);
});

/* ---- iPhone: pizzico a due dita e blocco schermo ----
   Il pizzico (gesturestart) ingrandiva la pagina. Col blocco schermo iOS interrompe l'AudioContext: il player credeva di suonare
   ancora e il tasto Play non faceva nulla finché non si ricaricava la pagina. Ora, tornati sulla pagina, si prova a riprendere;
   se iOS non lo permette senza un tocco, il player si mette in pausa dov'era arrivato, e un tocco su Play riparte. */
document.addEventListener("gesturestart", (e) => e.preventDefault());
function riprendiAudio() {
  if (!ctx || !playing || ctx.state === "running") return;
  const c0 = ctx.currentTime;
  try { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  setTimeout(() => {
    if (!playing || !ctx) return;
    if (ctx.state !== "running" || ctx.currentTime === c0) { offset = position(); engineStop(); playing = false; setPlayIcon(); stopUnlock(); }
  }, 800);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") riprendiAudio(); });
addEventListener("pageshow", riprendiAudio);
addEventListener("focus", riprendiAudio);
try {
  if ("mediaSession" in navigator) {     // tasti play/pausa nella schermata di blocco
    navigator.mediaSession.setActionHandler("play", () => play());
    navigator.mediaSession.setActionHandler("pause", () => pause());
  }
} catch (e) {}

/* ---- Misurazione d'uso (hub insegnante, «Attività») ----
   Parte solo se questo dispositivo è stato abilitato dalla pagina dello studente (stems-trk:CODICE = 1) e il brano è stato
   aperto da lì. Manda: apertura del brano e, quando si esce, i secondi di ascolto. Nient'altro. */
let trkSec = 0, trkUltimo = 0;
function trkCodice() {
  try { const c = sessionStorage.getItem("stems-da"); return c && localStorage.getItem("stems-trk:" + c) === "1" ? c : ""; } catch (e) { return ""; }
}
function trkInvia(t, extra) {
  const c = trkCodice(); if (!c) return;
  try {
    const corpo = JSON.stringify(Object.assign({ c: c, t: t, b: SLUG }, extra || {}));
    const ok = navigator.sendBeacon && navigator.sendBeacon("/api/e", new Blob([corpo], { type: "text/plain" }));
    if (!ok) fetch("/api/e", { method: "POST", body: corpo, keepalive: true, headers: { "Content-Type": "text/plain" } }).catch(() => {});
  } catch (e) {}
}
function trkInvioAscolto() { if (trkSec >= 5) trkInvia("ascolto", { s: Math.round(trkSec) }); trkSec = 0; }
setInterval(() => {
  const ora = Date.now();
  if (playing && trkUltimo) trkSec += Math.min(2, (ora - trkUltimo) / 1000);
  trkUltimo = ora;
}, 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") trkInvioAscolto(); });
addEventListener("pagehide", trkInvioAscolto);

(async () => {
  if (!window.crypto || !crypto.subtle) { showGate(tr("needHttps")); $("openBtn").disabled = true; return; }
  const m = location.hash.match(/(?:^#|&)p=([^&]*)/);
  let fromLink = null;
  const da = location.hash.match(/(?:^#|&)da=([0-9a-f]{6,32})(?:&|$)/);     // opened from a student's page: link back to it
  try {
    if (da) sessionStorage.setItem("stems-da", da[1]);
    if (da) { const st = location.hash.match(/(?:^#|&)st=(piano|chitarra)(?:&|$)/); if (st) sessionStorage.setItem("stems-st", st[1]); else sessionStorage.removeItem("stems-st"); }    // lo strumento dello studente (dal portale); senza: non noto
    const code = da ? da[1] : sessionStorage.getItem("stems-da");
    if (code) { $("backLink").href = "../s/" + code + "/"; $("backLink").hidden = false; }
  } catch (e) {}
  if (m) {
    try { fromLink = decodeURIComponent(m[1]); } catch (e) { fromLink = m[1]; }
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem(PW_KEY) || localStorage.getItem("stems-pw"); } catch (e) {}
  for (const [pw, keep] of [[fromLink, true], [saved, false]]) {
    const r = await tryUnlock(pw);
    if (r) { if (keep || r.pw !== pw) remember(r.pw); startPlayer(r.meta, r.key, r.pw); trkInvia("brano"); return; }
  }
  showGate("");
})();
