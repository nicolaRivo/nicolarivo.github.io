<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Practice Stems</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Base: this page is served as-is, so it carries its own reset. */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: a mixing desk — one transport bar, then one channel strip per stem (controls left, waveform right). */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --fg: #1d2127;
  --muted: #646b75;
  --line: #d6dae0;
  --accent: #a3243b;
  --accent-fg: #ffffff;
  --tc-red: #c62828; --tc-green: #1f7a3f; --tc-blue: #1565c0; --tc-orange: #c25e00; --tc-purple: #7b3fa0; --tc-black: #111418;
  --solo: #d9a400;
  --solo-fg: #1d2127;
  --wave-dim: #c3c8cf;
  --sel: rgba(163, 36, 59, 0.12);
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --muted: #9aa1ab; --line: #2e3238;
    --accent: #e0566c; --accent-fg: #15171b; --solo: #e8b923; --solo-fg: #15171b; --tc-red: #ff6b6b; --tc-green: #4cc474; --tc-blue: #5aa9ff; --tc-orange: #ff9a3c; --tc-purple: #c08bff; --tc-black: #f2f3f5;
    --wave-dim: #3a3f47; --sel: rgba(224, 86, 108, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --muted: #9aa1ab; --line: #2e3238;
  --accent: #e0566c; --accent-fg: #15171b; --solo: #e8b923; --solo-fg: #15171b; --tc-red: #ff6b6b; --tc-green: #4cc474; --tc-blue: #5aa9ff; --tc-orange: #ff9a3c; --tc-purple: #c08bff; --tc-black: #f2f3f5;
  --wave-dim: #3a3f47; --sel: rgba(224, 86, 108, 0.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* Niente zoom col doppio tocco (la pagina si ingrandiva e il layout si sfasava). Le onde hanno già pan-y, che lo esclude. */
html, body, button, label, input, select, summary, a { touch-action: manipulation; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.backlink { display: inline-flex; align-items: center; min-height: 44px; margin: 0 0 4px -4px; padding: 0 4px; color: var(--muted); text-decoration: none; font-size: 0.95rem; }
.backlink:hover { color: var(--accent); }
h1 { font-family: var(--display); font-style: italic; font-weight: 600; font-size: clamp(2rem, 5vw, 3rem); line-height: 1; margin: 0; text-wrap: balance; }
.byline { color: var(--muted); font-size: 0.95rem; margin: 6px 0 0; }
.hint { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 46ch; }

.transport {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; max-height: calc(100vh - 12px); overflow-y: auto;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.play {
  width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.play:disabled { opacity: 0.4; cursor: wait; }
.play svg { width: 20px; height: 20px; fill: currentColor; }
.time { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.95rem; white-space: nowrap; }
.time .dur { color: var(--muted); }
.seek { flex: 1 1 260px; min-width: 0; accent-color: var(--accent); }
.tbtn {
  font: 500 0.82rem var(--body); letter-spacing: 0.03em; padding: 7px 12px; border-radius: 6px;
  border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap;
}
.tbtn[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.tbtn:disabled { opacity: 0.4; cursor: default; }
.speed { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 0; }
.speed label { font: 500 0.82rem var(--body); letter-spacing: 0.03em; }
.speed input { flex: 1; min-width: 0; accent-color: var(--accent); }
.speed output { font-family: var(--mono); font-size: 0.9rem; font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: right; }
.speed.slow output { color: var(--accent); font-weight: 500; }
.loopinfo { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pitch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1 1 300px; min-width: 0; }
.pitch label { font: 500 0.82rem var(--body); letter-spacing: 0.03em; }
.pitch .st { font-family: var(--mono); font-size: 0.85rem; min-width: 11ch; text-align: center; font-variant-numeric: tabular-nums; }
.pitch.on .st { color: var(--accent); font-weight: 500; }
.pitch input[type=range] { flex: 1 1 90px; min-width: 90px; accent-color: var(--accent); }
.songinfo { flex: 1 0 100%; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.loopmenu { flex: 1 0 100%; border-top: 1px solid var(--line); padding-top: 10px; }
.loopmenu > summary { cursor: pointer; font: 600 0.82rem var(--body); list-style: none; display: flex; align-items: center; gap: 8px; }
.loopmenu > summary::-webkit-details-marker { display: none; }
.loopmenu > summary::before { content: "▸"; }
.loopmenu[open] > summary::before { content: "▾"; }
.loopmenu .body { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.lrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.lrow label { font: 500 0.82rem var(--body); display: flex; align-items: center; gap: 8px; }
.lrow input[type=number], .srow input[type=number], .srow select { font: 500 0.88rem var(--mono); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; }
.lrow input[type=number] { width: 9ch; }
.srow input[type=number] { width: 8ch; }
.nudge { display: inline-flex; gap: 4px; }
.nudge .tbtn { padding: 5px 7px; font-family: var(--mono); font-size: 0.75rem; }
.lsaved { display: flex; flex-wrap: wrap; gap: 6px; }
.lsaved .none { color: var(--muted); font-size: 0.8rem; }
.lchip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font: 0.78rem var(--mono); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; background: transparent; color: var(--fg); }
.lchip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 0.95rem; padding: 0 4px; }
.gatebox { display: flex; flex-direction: column; gap: 10px; }
.settings h3 { font: 600 0.95rem var(--body); margin: 8px 0 0; }
.guide { margin: 18px 0 6px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; }
.guide > summary { cursor: pointer; font: 600 0.9rem var(--body); }
.guidebody { margin-top: 10px; max-width: 78ch; font-size: 0.9rem; line-height: 1.5; }
.guidebody h3 { font: 600 0.95rem var(--body); margin: 16px 0 4px; }
.guidebody p, .guidebody ul { margin: 4px 0; color: var(--fg); }
.guidebody ul { padding-left: 20px; }
.guidebody li { margin: 3px 0; }
.statusline { flex: 1 0 100%; display: flex; flex-direction: column; gap: 6px; }
.statusline:has(.status:empty) { display: none; }
.status { font-size: 0.88rem; color: var(--muted); margin: 0; }
.status[data-kind="error"] { color: var(--accent); font-weight: 500; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
.retry { align-self: flex-start; border-color: var(--accent); color: var(--accent); }
.play.waiting { opacity: 0.55; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.85; } }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.meter i { display: block; height: 100%; width: 0; background: var(--fg); }


.eq { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
.eq label { font: 500 0.82rem var(--body); letter-spacing: 0.03em; display: flex; align-items: center; gap: 8px; }
.eq input { width: 130px; accent-color: var(--accent); }
.eq output { font-family: var(--mono); font-size: 0.85rem; min-width: 5ch; text-align: right; font-variant-numeric: tabular-nums; }
.eqhint { color: var(--muted); font-size: 0.8rem; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group.closed .strip.inside { display: none; }
.group:not(.closed) .strip.inside { margin-left: 22px; border-left: 3px solid var(--wave-dim); }
.group.closed .groupstrip { box-shadow: 0 5px 0 -2px var(--panel), 0 6px 0 -2px var(--line); margin-bottom: 6px; }
.groupstrip .name { cursor: pointer; }
.fold { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg); font: 600 0.75rem var(--body); padding: 2px 10px 2px 7px; cursor: pointer; }
.fold .cnt { color: var(--muted); font-weight: 500; }
.fold .chev { font-size: 0.95rem; line-height: 1; }
.gpart { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 0; border-top: 1px solid var(--line); }
.gpart .gname { min-width: 170px; }
.gpart label { font: 500 0.82rem var(--body); display: flex; align-items: center; gap: 8px; }
.gpart input[type=range] { width: 130px; accent-color: var(--accent); }
.gpart output { font-family: var(--mono); font-size: 0.82rem; min-width: 7ch; font-variant-numeric: tabular-nums; }
.gpart.off { opacity: 0.5; }
.sub { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
.settings, .tsettings { flex: 1 0 100%; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.settings h2 { font: 600 0.95rem var(--body); margin: 0; }
.settings p, .tsettings p { margin: 0; color: var(--muted); font-size: 0.85rem; max-width: 70ch; }
.srow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.srow label { font: 500 0.82rem var(--body); display: flex; align-items: center; gap: 8px; }
.srow input[type=range] { width: 170px; accent-color: var(--accent); }
.srow output { font-family: var(--mono); font-size: 0.85rem; min-width: 8ch; font-variant-numeric: tabular-nums; }
.warn { color: var(--accent) !important; font-weight: 500; }
.dot { color: var(--accent); }
.tsettings summary { cursor: pointer; font: 500 0.82rem var(--body); color: var(--muted); }
.langbtn { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 20; padding: 4px 10px; background: var(--panel); }
.gstat { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
.gtag { font: 600 0.65rem var(--mono); letter-spacing: 0.06em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-left: 6px; display: none; }
.strip.gated .gtag { display: inline-block; }
.gtag.on { background: var(--accent); color: var(--accent-fg); }
.steps { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: 0.85rem; max-width: 70ch; display: flex; flex-direction: column; gap: 4px; }
.gate { min-height: 70vh; display: grid; place-items: center; }
.gatecard { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.gatecard h1 { font-size: 2rem; }
.gatecard p { margin: 0; color: var(--muted); }
.gatecard input[type=password] { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.remember { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); padding: 10px 14px; font-size: 0.95rem; }
.gateerr { color: var(--accent) !important; font-weight: 500; }
.gatewait { color: var(--muted); }
.desk { display: flex; flex-direction: column; gap: 8px; }
.strip {
  display: grid; grid-template-columns: 240px minmax(0, 1fr); align-items: stretch;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  transition: opacity 0.15s;
}
.strip.silent { opacity: 0.5; }
.ctrl { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--line); }
.name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.chip { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.row { display: flex; align-items: center; gap: 8px; }
.ms {
  width: 36px; height: 30px; border-radius: 5px; border: 1px solid var(--line); background: transparent;
  color: var(--fg); font: 600 0.8rem var(--mono); cursor: pointer; flex: none;
}
.ms.m[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--panel); }
.ms.s[aria-pressed="true"] { background: var(--solo); border-color: var(--solo); color: var(--solo-fg); }
.vol { flex: 1; min-width: 0; accent-color: var(--fg); }
.wave { position: relative; min-height: 76px; cursor: crosshair; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.keys { color: var(--muted); font-size: 0.82rem; margin: 0; }
.keys kbd { font-family: var(--mono); font-size: 0.78rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--panel); }

@media (max-width: 640px) {
  .strip { grid-template-columns: 1fr; }
  .ctrl { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; flex-wrap: wrap; }
  .name { flex: 1 0 100%; }
  .ctrl .row { flex: 1; }
  .wave { min-height: 60px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { .strip, .progress i { transition: none; } .play.waiting { animation: none; } }

/* ===== Schede: Home, Tracce, Loop, Impostazioni ===== */
:root { --tabs-h: 56px; --dock-h: 64px; --safe-b: env(safe-area-inset-bottom, 0px); --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
body { padding-block: 14px 0; }
.wrap { gap: 12px; padding-bottom: calc(var(--tabs-h) + var(--dock-h) + var(--safe-b) + 20px); }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.top h1 { font-size: clamp(1.7rem, 4.6vw, 2.5rem); }
.top .byline { margin-top: 4px; }
.top .statusline { flex: 1 0 100%; }
.tabhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.tabhead h2, .card h2 { font: 600 1rem var(--body); margin: 0; }
.tab[hidden] { display: none !important; }

/* barra delle schede: in basso sul telefono, a sinistra in orizzontale, in alto su schermo largo */
.tabsbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabsbar button { flex: 1; min-height: var(--tabs-h); border: 0; background: transparent; color: var(--muted); font: 600 0.74rem var(--body); letter-spacing: 0.02em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
.tabsbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabsbar svg .k { fill: var(--panel); }
.tabsbar button[aria-selected="true"] { color: var(--accent); }
.tabsbar button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.tabsbar .dot { position: absolute; top: 8px; right: calc(50% - 20px); font-size: 1.2rem; line-height: 1; }

/* trasporto sempre visibile */
.minibar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + var(--safe-b)); z-index: 29; height: var(--dock-h); background: var(--panel); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 max(12px, env(safe-area-inset-left, 0px)) 0 max(12px, env(safe-area-inset-right, 0px)); }
.minibar .play { width: 48px; height: 48px; }
.minibar .time { font-size: 0.9rem; min-width: 8.6ch; text-align: right; }
.minibar .seek { flex: 1 1 auto; min-width: 40px; margin: 0; min-height: 32px; }
.minibar .loopbtn { min-width: 56px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.minibar .loopbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.minibar .meter { display: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabs-h) + var(--dock-h) + var(--safe-b) + 12px); z-index: 40; background: var(--fg); color: var(--bg); font: 500 0.85rem var(--body); padding: 8px 14px; border-radius: 999px; max-width: 90vw; text-align: center; }

@media (orientation: landscape) and (max-height: 520px) {
  :root { --dock-h: 56px; --rail: calc(76px + env(safe-area-inset-left, 0px)); }
  body { padding-left: calc(var(--rail) + 14px); padding-block: 10px 0; }
  .tabsbar { top: 0; bottom: 0; left: 0; right: auto; width: var(--rail); flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: env(safe-area-inset-top, 0px) 0 var(--safe-b) env(safe-area-inset-left, 0px); }
  .tabsbar button { min-height: 0; }
  .tabsbar button[aria-selected="true"]::before { left: 0; right: auto; top: 22%; bottom: 22%; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
  .tabsbar .dot { top: 6px; right: 14px; }
  .minibar { left: var(--rail); bottom: 0; padding-bottom: var(--safe-b); height: calc(var(--dock-h) + var(--safe-b)); }
  .wrap { padding-bottom: calc(var(--dock-h) + var(--safe-b) + 14px); gap: 8px; }
  .toast { bottom: calc(var(--dock-h) + var(--safe-b) + 10px); }
  .top h1 { font-size: 1.5rem; }
}
@media (min-width: 900px) and (min-height: 521px) {
  :root { --dock-h: 68px; }
  .tabsbar { position: sticky; top: 0; bottom: auto; left: auto; right: auto; border: 1px solid var(--line); border-radius: 10px; padding: 0; z-index: 30; }
  .tabsbar button { flex-direction: row; gap: 8px; min-height: 48px; font-size: 0.85rem; }
  .tabsbar button[aria-selected="true"]::before { top: auto; bottom: 0; left: 18%; right: 18%; height: 3px; border-radius: 3px 3px 0 0; }
  .tabsbar .dot { top: 8px; right: calc(50% - 60px); }
  .minibar { bottom: 0; padding-inline: max(16px, calc((100vw - 1080px) / 2)); }
  .minibar .meter { display: block; }
  .wrap { padding-bottom: calc(var(--dock-h) + 24px); }
  .toast { bottom: calc(var(--dock-h) + 14px); }
}

/* Home */
.homegrid { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 700px), (orientation: landscape) and (max-height: 520px) { .homegrid { grid-template-columns: minmax(240px, 0.9fr) minmax(0, 1.5fr); } }
.homeinfo, .homewave { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.facts { display: flex; gap: 8px; }
.fact { flex: 1 1 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; }
.fact .k { font: 600 0.68rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.fact .v { font: 500 1.45rem var(--mono); font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.fact .s { font: 0.72rem var(--mono); color: var(--muted); min-height: 1em; white-space: nowrap; }
.factnote { margin: 0; color: var(--muted); font-size: 0.82rem; min-height: 1.2em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.card p { margin: 0; color: var(--muted); font-size: 0.85rem; max-width: 70ch; }
.card .speed, .card .pitch { flex: none; }

/* Impostazioni */

@media (pointer: coarse) {

.rs-sc-row { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-start; } .rs-sc-row .rs-kbw { flex: 1 1 420px; min-width: 0; max-width: 720px; }
.rs-deg { border-collapse: separate; border-spacing: 3px 2px; text-align: center; flex: none; }
.rs-deg td { min-width: 34px; padding: 3px 4px; border-radius: 6px; cursor: pointer; outline-offset: 1px; } .rs-deg td:hover, .rs-deg td:focus-visible { background: var(--sel); }
.rs-deg td.d { font: 500 0.78rem var(--mono); color: var(--muted); } .rs-deg td.n { font: 600 1.05rem var(--body); }
.rs-deg td.d[class*="tc-"], .rs-deg td.n[class*="tc-"] { font-weight: 700; } .rs-deg td.d[class*="tc-"] { opacity: 0.9; }
.rs-dtip { margin: 10px 0 0; min-height: 3.2em; max-width: 78ch; color: var(--muted); font-size: 0.9rem; } .rs-dtip.on { color: var(--fg); }
.rs-pnote { margin: 6px 0 0; max-width: 78ch; color: var(--muted); font-size: 0.85rem; }
.rs-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: baseline; }
.rs-dot.tc-bg-red { background: var(--tc-red); } .rs-dot.tc-bg-green { background: var(--tc-green); } .rs-dot.tc-bg-blue { background: var(--tc-blue); }
.rs-kbw { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; } .rs-kb { display: block; height: auto; }
.rs-kb .pk-w { fill: #fbfbf9; stroke: #8d939c; stroke-width: 1; } .rs-kb .pk-b { fill: #23262b; stroke: var(--panel); stroke-width: 2; } .rs-kb .on { fill: var(--accent); }
.rs-kb .pk-dot { fill: #e11d2e; stroke: #fff; stroke-width: 1.5; }
.rs-kb .pk-c { font: 500 9px var(--body); fill: #8d939c; pointer-events: none; }
.rs-kb .pk-t { font: 600 11px var(--body); fill: #fff; pointer-events: none; } .rs-kb .pk-t.dk { fill: #23262b; } .rs-kb .pk-w.on + .pk-t, .rs-kb .pk-t.tn { font-weight: 800; }
.rs-kb .on ~ .pk-t { fill: var(--accent-fg); }
.rs-edit .rs-scrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; } .rs-edit .rs-scrow select { min-height: 36px; }
.rs-edit .rs-hint { margin: 4px 0 8px; }
.rs-edit .rs-f { display: grid; gap: 4px; margin-bottom: 12px; font-size: 0.85rem; font-weight: 500; }
.rs-edit input[type=text], .rs-edit textarea { font: 0.9rem var(--mono); width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); box-sizing: border-box; }
.rs-edit textarea { resize: vertical; min-height: 80px; }
.rs-help { margin: 0 0 12px; font-size: 0.78rem; color: var(--muted); line-height: 1.5; } .rs-help code { font-family: var(--mono); }
.rs-row { display: flex; gap: 8px; flex-wrap: wrap; } .rs-up { display: inline-flex; align-items: center; cursor: pointer; }
.rs-out { min-height: 1.4em; margin: 8px 0 0; font-size: 0.82rem; color: var(--muted); }
.rs-frow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 0.85rem; }
@media (max-width: 700px) { .rb { grid-template-columns: repeat(2, 1fr); } .rs-strip { flex-direction: column; } .rc li { grid-template-columns: 1fr; gap: 2px; } }

/* ---- viste di colore: segno non cromatico + colore (per chi non distingue i colori) ---- */
.cc { color: var(--cc); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cc { color: color-mix(in srgb, var(--cc) 55%, white); } }
:root[data-theme="dark"] .cc { color: color-mix(in srgb, var(--cc) 55%, white); }
.rb-c.cc b { color: inherit; } .rb-c.cc small { color: var(--muted); }
.rb-c b, .rl-c { font-weight: 700; }
.rb-c, .rl-c, .rl-ic { position: relative; transition: filter .12s, opacity .12s; }
.rb-c[role="button"]:hover b, .rl-c[role="button"]:hover, .rl-ic[role="button"]:hover { filter: brightness(1.25) saturate(1.15); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rb-c[role="button"]:hover b, :root:not([data-theme="light"]) .rl-c[role="button"]:hover { filter: brightness(1.2); } }
.rb-c[data-tip]:hover::after, .rl-c[data-tip]:hover::after, .rl-ic[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 0; bottom: 100%; margin-bottom: 4px; z-index: 30; width: max-content; max-width: 280px; white-space: normal; padding: 4px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); font: 500 0.75rem var(--body); font-style: normal; pointer-events: none; }
.rb-c[role="button"], .rl-c[role="button"], .rl-ic[role="button"] { cursor: pointer; } .rl-ic { font: 700 0.95rem var(--mono); font-style: normal; } .rl-ic.bad { text-decoration: underline wavy var(--accent); } .rb-c[role="button"]:focus-visible, .rl-c[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.rs-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; } .rs-lg { font-size: 0.8rem; color: var(--fg); } .rs-lg.hint { color: var(--muted); }
.rs-sw { font: 700 0.9rem var(--mono); font-style: normal; }
.rs-verb { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; cursor: pointer; } .rs-verb input { width: 18px; height: 18px; accent-color: var(--accent); }
.rs-ndbox { margin: 0 0 14px; } .rs-ndbox h4 { margin: 12px 0 2px; font-size: 0.9rem; } .rs-hint { margin: 0 0 8px; font-size: 0.78rem; color: var(--muted); }
.rs-nd { display: grid; grid-template-columns: 130px 1fr 250px; gap: 8px; align-items: center; margin: 0 0 6px; } .rs-nd b { font: 700 0.85rem var(--mono); white-space: pre; }
.rs-nd input, .rs-nd select { font: 0.85rem var(--body); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
@media (max-width: 640px) { .rs-nd { grid-template-columns: 1fr; } }
.rs-tip { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 0.9rem; }
.rs-chk { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 0.85rem; } .rs-chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.rs-prev { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; margin: 0 0 12px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); font-size: 0.85rem; }
</style>
</head>
<body>

<button class="tbtn langbtn" id="langBtn" aria-label="Language"></button>
<div class="gate" id="gate">
  <form class="gatecard" id="gateForm" hidden>
    <h1 data-i18n="title"></h1>
    <p data-i18n="enterPw"></p>
    <input type="password" id="pw" autocomplete="current-password" data-i18n-ph="pwPh" required>
    <label class="remember"><input type="checkbox" id="rememberPw" checked> <span data-i18n="remember"></span></label>
    <button type="submit" class="tbtn primary" id="openBtn" data-i18n="open"></button>
    <p class="gateerr" id="gateErr" hidden></p>
  </form>
  <p class="gatewait" id="gateWait" data-i18n="opening"></p>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="titlebox">
      <a class="backlink" id="backLink" hidden data-i18n="mySongs"></a>
      <h1 id="songTitle"></h1>
      <p class="byline" id="songArtist"></p>
    </div>
    <div class="statusline">
      <p class="status" id="status"></p>
      <p class="status" id="startNote" hidden data-i18n="startNote"></p>
      <div class="progress" id="prog"><i></i></div>
      <button class="tbtn retry" id="retry" hidden data-i18n="retry"></button>
    </div>
  </header>

  <nav class="tabsbar" id="tabsbar" role="tablist">
    <button role="tab" data-tab="home" aria-selected="true" aria-controls="tab-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span data-i18n="tabHome"></span></button>
    <button role="tab" data-tab="tracks" aria-selected="false" aria-controls="tab-tracks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18M12 3v18M18 3v18"/><rect class="k" x="3.5" y="8" width="5" height="4" rx="1.2"/><rect class="k" x="9.5" y="14" width="5" height="4" rx="1.2"/><rect class="k" x="15.5" y="5" width="5" height="4" rx="1.2"/></svg><span data-i18n="tabTracks"></span></button>
    <button role="tab" data-tab="loop" aria-selected="false" aria-controls="tab-loop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 014-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 01-4 4H4"/></svg><span data-i18n="tabLoop"></span></button>
    <button role="tab" data-tab="risorse" aria-selected="false" aria-controls="tab-risorse" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/><path d="M6.5 8.5H9M6.5 11.5H9M15 8.5h2.5M15 11.5h2.5"/></svg><span data-i18n="tabRis"></span></button>
    <button role="tab" data-tab="settings" aria-selected="false" aria-controls="tab-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h9M18 7h3M3 17h3M12 17h9"/><circle class="k" cx="15" cy="7" r="2.4"/><circle class="k" cx="9" cy="17" r="2.4"/></svg><span data-i18n="tabSettings"></span><span class="dot" id="setDot" hidden>•</span></button>
  </nav>

  <main id="main">
    <section class="tab" id="tab-home" role="tabpanel">
      <div class="homegrid">
        <div class="homeinfo">
          <div class="facts">
            <div class="fact"><span class="k">BPM</span><span class="v" id="fBpm">—</span><span class="s" id="fBpmS"></span></div>
            <div class="fact"><span class="k" data-i18n="keyLbl"></span><span class="v" id="fKey">—</span><span class="s" id="fKeyS"></span></div>
            <div class="fact"><span class="k" data-i18n="sigShort"></span><span class="v" id="fSig">—</span><span class="s">&nbsp;</span></div>
          </div>
          <p class="factnote" id="fNote"></p>
          <div class="card">
            <div class="speed">
              <label for="speed" data-i18n="speed"></label>
              <input type="range" id="speed" min="50" max="100" step="5" value="100" aria-describedby="speedVal">
              <output id="speedVal" for="speed">100%</output>
            </div>
            <div class="pitch" id="pitch">
              <label data-i18n="pitch"></label>
              <button class="tbtn" id="stDown" data-i18n-aria="stDown">−</button>
              <output class="st" id="pitchVal">0 st</output>
              <button class="tbtn" id="stUp" data-i18n-aria="stUp">+</button>
              <input type="range" id="cents" min="-50" max="50" step="1" value="0" data-i18n-aria="cents" style="flex:1 1 90px;min-width:90px">
              <button class="tbtn" id="pitchReset" data-i18n="zero"></button>
            </div>
          </div>
        </div>
        <div class="homewave">
          <div class="wavehead">
            <label><span class="lbltxt" data-i18n="waveLbl"></span> <select class="pick" id="homeSrc" data-i18n-aria="waveLbl"></select></label>
            <button class="tbtn" id="back" data-i18n-aria="back5">−5 s</button>
          </div>
          <div class="bigwave" id="homeWave"><canvas></canvas></div>
          <p class="rotate" id="rotHome"><span data-i18n="rotate"></span><button class="tbtn rotok" data-i18n="gotIt"></button></p>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-tracks" role="tabpanel" hidden>
      <div class="tabhead"><h2 data-i18n="tabTracks"></h2><button class="tbtn" id="reset" data-i18n="reset"></button></div>
      <div class="desk" id="desk"></div>
    </section>

    <section class="tab" id="tab-loop" role="tabpanel" hidden>
      <div class="looplayout">
        <div class="loopview">
          <div class="wavehead">
            <label><span class="lbltxt" data-i18n="waveLbl"></span> <select class="pick" id="loopSrc" data-i18n-aria="waveLbl"></select></label>
            <span class="loopinfo" id="loopInfo"></span>
          </div>
          <div class="bigwave ov" id="ovWave"><canvas></canvas></div>
          <div class="bigwave zoom" id="loopWave"><canvas></canvas></div>
          <div class="lens" id="lens" hidden><canvas id="lensCanvas"></canvas><span class="lenslbl" id="lensLbl"></span></div>
        </div>
        <div class="loopctl">
          <div class="edges">
            <div class="edge active" id="edgeA" data-edge="0">
              <span class="elabel" data-i18n="start"></span>
              <div class="tfield"><button class="tdisp" id="tA" data-edge="0" type="button" disabled>–:––.––––</button><input class="tin" id="lpA" type="text" inputmode="decimal" hidden></div>
              <div class="arrows"><button class="tbtn arr" data-edge="0" data-dir="-1" data-i18n-aria="earlier" disabled>◀</button><button class="tbtn arr" data-edge="0" data-dir="1" data-i18n-aria="later" disabled>▶</button></div>
            </div>
            <div class="edge" id="edgeB" data-edge="1">
              <span class="elabel" data-i18n="end"></span>
              <div class="tfield"><button class="tdisp" id="tB" data-edge="1" type="button" disabled>–:––.––––</button><input class="tin" id="lpB" type="text" inputmode="decimal" hidden></div>
              <div class="arrows"><button class="tbtn arr" data-edge="1" data-dir="-1" data-i18n-aria="earlier" disabled>◀</button><button class="tbtn arr" data-edge="1" data-dir="1" data-i18n-aria="later" disabled>▶</button></div>
            </div>
          </div>
          <div class="grainbox">
            <div class="glabel"><span data-i18n="grain"></span><span id="grainNote"></span></div>
            <div class="grain">
              <button class="tbtn" id="grainDown" data-i18n-aria="grainCoarser">‹</button>
              <select id="grainSel" data-i18n-aria="grain"></select>
              <button class="tbtn" id="grainUp" data-i18n-aria="grainFiner">›</button>
            </div>
          </div>
          <div class="actions">
            <button class="tbtn" id="lockBtn" aria-pressed="false" disabled><span id="lockIcon">🔓</span> <span id="lockTxt" data-i18n="lock"></span></button>
            <button class="tbtn" id="restartBtn" disabled data-i18n="restart"></button>
            <button class="tbtn" id="saveBtn" disabled data-i18n="save"></button>
            <button class="tbtn" id="clearBtn" disabled data-i18n="clear"></button>
          </div>
          <div class="lsaved" id="lsaved"></div>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-risorse" role="tabpanel" hidden>
      <div class="tabhead"><h2 data-i18n="tabRis"></h2></div>
      <div id="risTabs"></div>
      <div class="rs-edit" id="risEditor" hidden></div>
      <div id="risView"></div>
    </section>

    <section class="tab" id="tab-settings" role="tabpanel" hidden>
      <div class="setcol">
        <div class="card">
          <h2 data-i18n="mineTitle"></h2>
          <p data-i18n="mineHelp"></p>
          <div class="eq" id="eq">
            <label><span data-i18n="eqLow"></span> <input type="range" id="eqLow" min="-48" max="18" step="1" value="0" data-i18n-aria="eqLow"><output id="eqLowV">0 dB</output></label>
            <label><span data-i18n="eqMid"></span> <input type="range" id="eqMid" min="-48" max="18" step="1" value="0" data-i18n-aria="eqMid"><output id="eqMidV">0 dB</output></label>
            <label><span data-i18n="eqHigh"></span> <input type="range" id="eqHigh" min="-48" max="18" step="1" value="0" data-i18n-aria="eqHigh"><output id="eqHighV">0 dB</output></label>
            <span class="eqhint" data-i18n="eqHint"></span>
          </div>
          <div class="srow"><button class="tbtn" id="langBtn2"></button></div>
        </div>
        <div class="card">
          <h2 data-i18n="loopSnapTitle"></h2>
          <p data-i18n="loopSnapHelp"></p>
          <div class="srow"><label><span data-i18n="snapSrc"></span> <select id="snapSrc"></select></label></div>
        </div>
        <div class="card gatebox" id="gateBox">
          <h2 data-i18n="gateTitle"></h2>
          <p data-i18n="gateHelp"></p>
          <p class="hubnote" id="hubGateNote" hidden data-i18n="hubGateNote"></p>
          <div class="srow">
            <label><input type="checkbox" id="gateOn"> <span data-i18n="gateOn"></span></label>
            <button class="tbtn" id="gateReset" data-i18n="resetSet"></button>
          </div>
          <div id="gateParts"></div>
          <p class="warn" id="gateWarn" hidden></p>
        </div>
        <details class="card teach" id="teachDet" data-hub="">
          <summary data-i18n="teacher"></summary>
          <p data-i18n="teacherHelp" id="teacherHelp"></p>
          <p class="hubnote" id="hubNote" hidden data-i18n="hubNote"></p>
          <h2 data-i18n="allTitle"></h2>
          <div class="srow">
            <label>BPM <input type="number" id="bpmIn" min="30" max="300" step="0.1"></label>
            <label><span data-i18n="keyLbl"></span> <select id="keyTonic"></select> <select id="keyMode"><option value="maj" data-i18n="kMaj"></option><option value="min" data-i18n="kMin"></option></select></label>
            <label><span data-i18n="sigLbl"></span> <select id="sigSel"></select></label>
          </div>
          <div class="srow">
            <label><span data-i18n="beat1"></span> <input type="number" id="beat0In" min="0" step="0.01"></label>
            <button class="tbtn" id="beat0Now" data-i18n="atPlayhead"></button>
            <button class="tbtn" id="detectNow" data-i18n="detectNow"></button>
            <button class="tbtn" id="songReset" data-i18n="songReset"></button>
          </div>
          <p id="detNote"></p>
          <div class="srow">
            <label><span data-i18n="startHome"></span> <select id="pvHome"></select></label>
            <label><span data-i18n="startLoop"></span> <select id="pvLoop"></select></label>
          </div>
          <div class="srow">
            <label><span data-i18n="initLang"></span> <select id="langSel"><option value="auto" data-i18n="langAuto"></option><option value="it">Italiano</option><option value="en">English</option></select></label>
          </div>
          <div class="srow">
            <button class="tbtn" id="useMix" data-i18n="useMix"></button>
            <button class="tbtn" id="clearMix" data-i18n="clearMix"></button>
            <span class="eqhint" id="mixNote"></span>
          </div>
          <p data-i18n="gateNote"></p>
          <div class="permbar">
            <button class="tbtn save" id="saveAll" hidden data-i18n="saveAll"></button>
            <button class="tbtn" id="copyCmd" data-i18n="copyCmd"></button>
            <output id="saveOut"></output>
          </div>
        </details>
        <details class="guide card" id="guide">
          <summary data-i18n="guideTitle"></summary>
          <div class="guidebody" data-i18n-html="guideHtml"></div>
          <p class="keys" data-i18n-html="keys"></p>
        </details>
      </div>
    </section>
  </main>

  <div class="minibar">
    <button class="play" id="play" aria-label="Play">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
    <div class="time"><span id="cur">0:00</span> <span class="dur">/ <span id="dur">0:00</span></span></div>
    <input type="range" class="seek" id="seek" min="0" max="1000" value="0" step="1" data-i18n-aria="position">
    <button class="tbtn loopbtn" id="loopBtn" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 014-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 01-4 4H4"/></svg><span data-i18n="loop"></span></button>
    <div class="meter" data-i18n-title="level" aria-hidden="true"><i id="meterFill"></i></div>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>
</div>

async function openWithPassword(password, openRegular, owner, pageSalt, decodeBase64) {
  if (!password) return null;
  try {
    return await openRegular(password);
  } catch (error) {
    if (!owner) return null;
  }
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({
      name: "PBKDF2", salt: decodeBase64(owner.salt), iterations: owner.iterations, hash: "SHA-256"
    }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const wrapped = decodeBase64(owner.wrapped);
    const regular = await crypto.subtle.decrypt({
      name: "AES-GCM", iv: wrapped.subarray(0, 12), additionalData: decodeBase64(pageSalt)
    }, key, wrapped.subarray(12));
    return await openRegular(new TextDecoder().decode(regular));
  } catch (error) {
    return null;
  }
}

    teacherSteps: "<li>Open the Drums group and solo one part, for example Floor. Loop a stretch where you can hear bleed between the hits.</li><li>In Settings, find that part and raise its <b>Threshold</b> until the bleed between the hits is gone. If quiet hits (ghost notes) start to vanish, lower it a little. The red shading on the waveform shows where the gate is closed, and GATE lights up while it is open.</li><li><b>Hysteresis</b>: if the gate flutters or cuts the tail of a hit, raise it. If bleed sneaks back in during a tail, lower it.</li><li>Repeat for the other parts: each one keeps its own values. Untick a part's <i>On</i> (or <i>Gate on</i> for all) to compare with and without.</li><li>Press <i>Copy command</i> and paste it in the Terminal on your Mac. Everyone who opens the page starts from these settings.</li>",

    "risHelpTeoText": "<b>Writing</b><ul><li>Blank line = new paragraph · <code>- </code> at the start of a line = list · <code>**bold**</code></li><li><code>**bold**</code> · <code>*italic*</code> · <code>__underline__</code> · <code>`monospace`</code> · <code>{red|coloured}</code> (red, green, blue, orange, purple, black). Or select the text and use the buttons above (⌘B, ⌘I, ⌘U).</li><li>Pick a student above: each one sees only their own text. The text is written for the student, so write it in English.</li></ul>",

    "risGuida": "Guide: terms and symbols explained", "risEmptyBook": "No real book chords yet.", "risEmptyLy": "No lyrics with chords yet.",
    "risHelpBook": "<b>How to write it</b><ul><li>Start with the time signature, then separate bars with <code>|</code>: <code>4/4 | Fmaj7 | C7 | Dm7 | Bb |</code></li><li>Two chords in a bar: <code>| Am7 D7 |</code> (one chord per beat when the beats divide evenly: 4 chords in 4/4, 3 in 3/4, 2 in 6/4; otherwise, or for an unusual rhythm, <code>@</code> gives the beat, <code>| Dm7 A7@4 |</code> (A7 on beat 4), <code>| Dm7 G7@3.5 |</code> (half a beat: the &amp; of 3); a bar with <code>@</code> shows rhythm slashes · a different time signature: write it before the bar, <code>6/4 | C Dm@4 |</code>, and write <code>4/4</code> again when it ends · repeat the previous bar: <code>%</code></li><li>Repeat: <code>||: … :||</code></li><li>First and second ending: <code>1. Am7 :||</code> then <code>2. Fmaj7 |</code></li><li>Section name on its own line: <code>[A]</code> · note on a bar: <code>{nota: text}</code></li><li>Key change: <code>{key: Ab maj}</code> before the first bar in the new key, and <code>{key: F maj}</code> to come back</li><li>Push (played an eighth early, written in the bar where it belongs): <code>| &lt;F7 |</code> or <code>&lt;A7@3</code>. The chord stays in its bar, and a grey copy tied to it by an arc appears on the &amp; before it, marked «push»</li><li>Colours: tonic, dominant and secondary dominant are coloured by themselves from the key. For the Modal interchange view mark a chord <code>Bbm6~min</code> (from the parallel minor) or <code>Ab~maj</code> (from the parallel major). A note on hover: <code>Bbm6~\"borrowed iv\"</code></li></ul>",
    "risHelpLy": "<b>How to write it</b><ul><li>Paste your chord sheet (chords on a line above the words), press <b>Detect chords and sections</b>, check the preview and save.</li><li>A chord is written <code>[Fmaj7]</code>, inside the words if you like: <code>[Fmaj7]Walking home a[C7]long</code></li><li>A section is <code>[$Verse]</code>, <code>[$Chorus]</code> on its own line</li><li>A chord that must stay inside the text line (instrumental parts): <code>{F} {F} {Fmaj7}</code></li><li>If the song changes key: <code>{key: Ab maj}</code> on a line of its own, and <code>{key: F maj}</code> to come back</li><li>Colours come from the key by themselves. For the Modal interchange view: <code>[Bbm6~min]</code> or <code>[Ab~maj]</code>. Note on hover: <code>[Bbm6~\"borrowed iv\"]</code></li></ul>",

    detected: "Rilevato: {0}.", analyzing: "Analisi di tempo e tonalità…", gridNote: "La griglia delle battute è fissa: con una band dal vivo il tempo oscilla un poco, quindi rifinisci i bordi con «Aggancia al colpo».",
    guideTitle: "Come usare questa pagina",
    guideHtml: "<h3>Le quattro schede</h3><ul><li><b>Home</b>: tempo, tonalità e tempo in chiave del brano, una grande forma d'onda (scegli quale parte mostrare) e i controlli di Velocità e Intonazione.</li><li><b>Tracce</b>: il mix. Ogni riga è una parte del brano: <b>M</b> la silenzia, <b>S</b> la mette in solo (più solo suonano insieme), il cursore ne regola il volume. <b>Azzera mix</b> torna al mix di partenza. Silenzia la parte che suoni tu e suonala insieme al resto.</li><li><b>Loop</b>: loop di precisione (vedi sotto).</li><li><b>Impostazioni</b>: EQ, lingua, a cosa si aggancia il loop e il gate della batteria.</li></ul><p>In qualunque scheda sei, senti il mix impostato in Tracce, con EQ, Velocità e Intonazione. Play, la barra della posizione e l'interruttore Loop stanno sempre in basso.</p><h3>Batteria</h3><ul><li>In Tracce, tocca <b>▸ Parti</b> sulla riga Drums per vedere Floor (cassa), Back (rullante), Subdivisions (charleston) e Fills (il resto). Metti in solo una o due parti per studiare solo quella: un gate silenzia tra un colpo e l'altro il bleed delle altre.</li></ul><h3>Loop</h3><ul><li>Tocca una forma d'onda per saltare lì. Trascina per fare il loop di quella sezione. L'interruttore <b>Loop</b> in basso accende e spegne il loop.</li><li>Nella scheda Loop la forma d'onda si ingrandisce sul loop, con tutto il brano nella striscia sottile sopra. Trascina le due maniglie, oppure usa le frecce ◀ ▶ sotto <i>Inizio</i> e <i>Fine</i>.</li><li><b>Grana</b> è di quanto una freccia sposta il bordo, da 5 s a 0,0001 s. Premi ‹ › per la grana precedente o successiva, oppure tocca il valore per sceglierne una. La cifra sottolineata del tempo è quella che si muove. Con grana di 0,01 s o meno compare un ingrandimento del bordo. Tieni premuta una freccia per ripetere.</li><li>L'ultimo gradino, <b>colpo</b>, fa saltare le frecce al colpo di batteria precedente o successivo (o della sorgente scelta nelle Impostazioni): il modo veloce per mettere un bordo esattamente sul tempo.</li><li>Tocca un tempo per scriverlo. <b>Blocca</b> congela il loop così non lo sposti per sbaglio. <b>Riavvia</b> lo suona dall'inizio. <b>Salva</b> lo tiene in un elenco su questo dispositivo: toccalo per richiamarlo, × per cancellarlo. <b>Togli</b> elimina il loop.</li></ul><h3>Velocità e intonazione</h3><ul><li><b>Velocità</b> rallenta il brano fino al 50% senza cambiare l'intonazione.</li><li><b>Intonazione</b>: − e + la spostano di un semitono alla volta (fino a un'ottava in su o in giù); il cursore è l'accordatura fine in cent (100 cent = 1 semitono). Velocità e intonazione funzionano insieme, e il tempo e la tonalità mostrati in Home le seguono.</li></ul><h3>EQ e gate della batteria</h3><ul><li>L'<b>EQ</b> nelle Impostazioni ha tre bande per tutto il mix. Tutto a sinistra taglia del tutto la banda; doppio clic o doppio tocco per azzerarla.</li><li>Ogni parte della batteria ha il suo gate: alza la <b>Soglia</b> se senti ancora bleed, abbassala se i colpi deboli spariscono. Restano su questo dispositivo e partono dalla scelta del tuo insegnante.</li></ul><h3>Per l'insegnante</h3><ul><li>Tempo, tonalità e tempo in chiave si rilevano quando si apre la pagina e con una band dal vivo possono essere sbagliati. Correggili una volta sola: apri il brano dall'Hub insegnante (Brani → Imposta), vai in Impostazioni → Per l'insegnante, cambiali e premi <b>Salva per tutti</b>. Chiunque apra la pagina dopo vede i valori giusti. Forme d'onda di partenza, mix di partenza, gate della batteria e lingua si salvano allo stesso modo.</li><li>Senza l'Hub, lo stesso pannello (Impostazioni → Per l'insegnante) ha <b>Copia il comando</b>: incollalo nel Terminale del tuo Mac.</li></ul>",

    teacherSteps: "<li>Apri il gruppo Drums e metti in solo una parte, per esempio Floor. Fai un loop su un passaggio dove si sente il bleed tra i colpi.</li><li>Nelle Impostazioni cerca quella parte e alza la sua <b>Soglia</b> finché il bleed tra i colpi sparisce. Se i colpi deboli (ghost notes) cominciano a sparire, abbassala un poco. La zona rossa sulla forma d'onda mostra dove il gate è chiuso, e GATE si accende mentre è aperto.</li><li><b>Isteresi</b>: se il gate sfarfalla o taglia la coda di un colpo, alzala. Se durante una coda rientra del bleed, abbassala.</li><li>Ripeti per le altre parti: ognuna tiene i suoi valori. Togli la spunta a <i>Attivo</i> di una parte (o a <i>Gate attivo</i> per tutte) per confrontare con e senza.</li><li>Premi <i>Copia il comando</i> e incollalo nel Terminale del tuo Mac. Chiunque apra la pagina parte da queste impostazioni.</li>",

let cryptoKey = null;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function base64Bytes(b64) {
  const bin = atob(b64.replace(/\s+/g, ""));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: base64Bytes(SALT), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function decryptBytes(key, bytes) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.subarray(0, 12) }, key, bytes.subarray(12));
  return new Uint8Array(plain);
}

function decode(data, label) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(label + " took too long to decode")), 60000);
    const ok = (b) => { clearTimeout(timer); resolve(b); };
    const fail = (e) => { clearTimeout(timer); reject(e || new Error("couldn't decode " + label)); };
    const p = ctx.decodeAudioData(data, ok, fail);
    if (p && typeof p.catch === "function") p.catch(fail);
  });
}

async function fetchBytes(t) {
  let last;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await wait(900 * attempt);
    t.loaded = 0;
    try {
      const res = await fetch(t.file, attempt ? { cache: "reload" } : undefined);
      if (!res.ok) { last = new Error("HTTP " + res.status); continue; }
      if (!res.body || !res.body.getReader) { const b = new Uint8Array(await res.arrayBuffer()); t.loaded = b.length; showProgress(); return b; }
      const reader = res.body.getReader();
      const parts = []; let n = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); n += value.length; t.loaded = n; showProgress();
      }
      const out = new Uint8Array(n); let o = 0;
      for (const p of parts) { out.set(p, o); o += p.length; }
      return out;
    } catch (e) { last = e; }
  }
  throw new Error(t.label + ": " + errText(last));
}

function showProgress() {
  const total = tracks.reduce((a, t) => a + t.bytes, 0);
  const got = tracks.reduce((a, t) => a + (t.buffer ? t.bytes : Math.min(t.bytes, t.loaded || 0)), 0);
  const pct = Math.min(100, Math.round((got / total) * 100));
  $("prog").firstElementChild.style.width = pct + "%";
  sayK("loadingP", "", pct, Math.round(got / 1048576), Math.round(total / 1048576));
}

function initAudio() {
  if (!AC) throw new Error("this browser doesn't support Web Audio");
  ctx = new AC();
  out = ctx.createGain();
  analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
  // Master EQ: the mix is split in three bands (below 200 Hz, 200 Hz to 4 kHz, above 4 kHz) with 4th-order
  // Linkwitz-Riley crossovers, which add back up flat. Each band has its own gain, so "fully left" is a true cut.
  const lr4 = (type, f) => {
    const a = ctx.createBiquadFilter(), b = ctx.createBiquadFilter();
    [a, b].forEach((n) => { n.type = type; n.frequency.value = f; n.Q.value = Math.SQRT1_2; });

  };

  const ap = ctx.createBiquadFilter(); ap.type = "allpass"; ap.frequency.value = F2; ap.Q.value = Math.SQRT1_2;   // keeps the low band in phase with the others

  out.connect(hp1[0]); hp1[1].connect(midLP[0]); midLP[1].connect(eqNodes[1]);

let loading = false;
async function load() {
  if (loading) return;

  $("retry").hidden = true;
  $("prog").hidden = false;
  try {
    if (!ctx) initAudio();
    showProgress();
    const queue = tracks.filter((t) => !t.buffer && !t.enc);
    const worker = async () => { while (queue.length) { const t = queue.shift(); const a = performance.now(); t.enc = await fetchBytes(t); (t.dbg = t.dbg || {}).dl = performance.now() - a; } };
    await Promise.all([worker(), worker(), worker()]);
    if (DEBUG) DBG.dl = dbgNow();
    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      if (t.buffer) continue;
      sayK("preparing", "", i + 1, tracks.length);
      t.decoding = true;
      try {
        const a = performance.now();
        const plain = await decryptBytes(cryptoKey, t.enc);
        const b = performance.now();

    $("startNote").hidden = true;

/* ---------- playback: one buffer source per stem, all started on the same clock tick ---------- */
function startSources(pos) {
  const my = ++gen;
  const when = ctx.currentTime + 0.06;
  const looping = !!(loop && loopOn);
  tracks.forEach((t, i) => {
    const s = ctx.createBufferSource();
    s.buffer = t.buffer;
    if (looping) { s.loop = true; s.loopStart = loop[0]; s.loopEnd = loop[1]; }
    s.connect(t.gain);
    if (i === 0) s.onended = () => { if (my === gen && playing) { stopSources(); playing = false; offset = 0; setPlayIcon(); stopUnlock(); } };
    s.start(when, Math.max(0, Math.min(pos, t.buffer.duration - 0.01)));
    t.src = s;
    if (t.gbuf && t.ggain) {          // the gated copy plays in step; applyMix decides which of the two is heard
      const gs = ctx.createBufferSource();
      gs.buffer = t.gbuf;
      if (looping) { gs.loop = true; gs.loopStart = loop[0]; gs.loopEnd = loop[1]; }
      gs.connect(t.ggain);
      gs.start(when, Math.max(0, Math.min(pos, t.gbuf.duration - 0.01)));
      t.gsrc = gs;
    }
  });

}

function stopSources() {
  gen++;

    if (!t.src) return;
    t.src.onended = null;
    try { t.src.stop(); } catch (e) {}
    try { t.src.disconnect(); } catch (e) {}
    t.src = null;
    if (t.gsrc) {

function position() {

  if (stretch) return stretchPosition();
  let p = offset + Math.max(0, ctx.currentTime - startedAt);
  if (loop && loopOn && p >= loop[1]) p = loop[0] + ((p - loop[0]) % (loop[1] - loop[0]));
  return Math.min(p, DURATION);
}

const partOf = (s, t) => ({ on: true, thr: 0, hyst: 0, ...((s.parts || {})[t.label] || {}) });
function normSettings(s) {              // also reads pages written with one threshold for the whole kit
  const o = { gate: s.gate !== false, parts: {} };
  for (const [k, v] of Object.entries(s.parts || {})) o.parts[k] = { on: v.on !== false, thr: +v.thr || 0, hyst: +v.hyst || 0 };
  if (s.thr || s.hyst) tracks.forEach((t) => {
    if (!t.gate) return;
    const p = o.parts[t.label] || { on: true, thr: 0, hyst: 0 };
    o.parts[t.label] = { ...p, thr: p.thr + (+s.thr || 0), hyst: p.hyst + (+s.hyst || 0) };
  });
  return o;
}
const sigOf = (s) => JSON.stringify([s.gate !== false, tracks.filter((t) => t.gate).map((t) => { const p = partOf(s, t); return [t.label, p.on !== false, +p.thr, +p.hyst]; })]);

// The gate listens to one frequency band per part (Floor: lows, Back: mids, Subdivisions: highs), so the bleed of
// the other parts, which has little energy there, does not hold it open. Same filters as stems.py.
function bandFilter(src, sr, band) {
  const x = Float32Array.from(src);
  for (const [kind, f] of band) {
    const w0 = (2 * Math.PI * f) / sr, c = Math.cos(w0), al = Math.sin(w0) / (2 * Math.SQRT1_2);
    const a0 = 1 + al, a1 = (-2 * c) / a0, a2 = (1 - al) / a0;
    const b0 = (kind === "lp" ? (1 - c) / 2 : (1 + c) / 2) / a0, b1 = (kind === "lp" ? 1 - c : -(1 + c)) / a0, b2 = b0;
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < x.length; i++) {
      const v = x[i], y = b0 * v + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = v; y2 = y1; y1 = y; x[i] = y;
    }
  }
  return x;
}

function buildEnv(buf, band) {                 // peak level in dB for every block of 128 samples
  const n = Math.ceil(buf.length / BLK), lin = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const x = band && band.length ? bandFilter(buf.getChannelData(c), buf.sampleRate, band) : buf.getChannelData(c);
    for (let b = 0; b < n; b++) {
      let m = 0;
      for (let i = b * BLK, e = Math.min(buf.length, i + BLK); i < e; i++) { const v = x[i] < 0 ? -x[i] : x[i]; if (v > m) m = v; }
      if (m > lin[b]) lin[b] = m;
    }
  }
  const env = new Float32Array(n);
  for (let b = 0; b < n; b++) env[b] = 20 * Math.log10(lin[b] + 1e-9);
  return env;
}

function gateCurve(t) {
  const g = t.gate, env = t.env, n = env.length, sr = t.buffer.sampleRate, p = partOf(settings, t);
  const open = g.open + p.thr, close = open - Math.max(0, g.hyst + p.hyst);
  const blkMs = (1000 * BLK) / sr, hold = Math.ceil(g.hold / blkMs);
  const ar = 1 - Math.exp(-blkMs / Math.max(0.3, g.attack)), rr = 1 - Math.exp(-blkMs / Math.max(1, g.release));
  const gain = new Float32Array(n);
  let isOpen = false, left = 0, cur = 0;
  for (let b = 0; b < n; b++) {
    const e = Math.max(env[b], b + 1 < n ? env[b + 1] : -200);       // look one block ahead so a hit's first moment is not clipped
    if (e >= open) { isOpen = true; left = hold; }
    else if (isOpen) { if (e >= close) left = hold; else if (left > 0) left--; else isOpen = false; }
    const target = isOpen ? 1 : 0;
    cur += (target - cur) * (target > cur ? ar : rr);
    gain[b] = cur;
  }
  return gain;
}

function buildGated(t) {
  const b = t.buffer, nb = ctx.createBuffer(b.numberOfChannels, b.length, b.sampleRate), gain = gateCurve(t);
  for (let c = 0; c < b.numberOfChannels; c++) {
    const x = b.getChannelData(c), y = nb.getChannelData(c);
    for (let k = 0; k < gain.length; k++) {
      const g0 = gain[k], d = (k + 1 < gain.length ? gain[k + 1] : g0) - g0, s = k * BLK, e = Math.min(b.length, s + BLK);
      for (let i = s; i < e; i++) y[i] = x[i] * (g0 + (d * (i - s)) / BLK);
    }
  }
  t.gbuf = nb;
  t.gcurve = gain;
  const N = t.peaks.length, mask = new Uint8Array(N);       // 1 where the gate is (mostly) closed, for the red shading
  for (let i = 0; i < N; i++) {
    const a = Math.floor((i / N) * gain.length), z = Math.max(a + 1, Math.floor(((i + 1) / N) * gain.length));
    let s = 0; for (let k = a; k < z && k < gain.length; k++) s += gain[k];
    mask[i] = s / (z - a) < 0.5 ? 1 : 0;
  }
  t.gmask = mask;
}
function rebuildGates(list) { (list || tracks).forEach((t) => { if (t.gate && t.buffer && t.env) buildGated(t); }); }

// A drum part is gated only while some, but not all, of the drum parts are soloed, and only if its own gate is on.
function gatedNow(t) {
  if (!settings.gate || !t.gbuf || !t.solo || partOf(settings, t).on === false) return false;
  return !tracks.filter((x) => x.group === t.group).every((x) => x.solo);
}

function saveSettings() {

    else localStorage.setItem(SET_KEY, JSON.stringify(settings));

}

function buildGateUi() {
  const box = $("gateParts");
  box.innerHTML = "";
  tracks.forEach((t) => {
    if (!t.gate) return;
    const d = document.createElement("div");
    d.className = "gpart";
    d.innerHTML = `<div class="gname"><b class="lbl" data-l="${t.label}">${t.label}</b> <span class="sub sublbl" data-l="${t.sub || ""}">${t.sub || ""}</span> <span class="warn gq" hidden>?</span></div>
      <label><input type="checkbox" class="gpOn"> <span data-i18n="gateOnShort"></span></label>
      <label><span data-i18n="thr"></span> <input type="range" class="gpThr" min="-12" max="12" step="0.5" value="0"><output class="gpThrV"></output></label>
      <label><span data-i18n="hyst"></span> <input type="range" class="gpHyst" min="-6" max="12" step="0.5" value="0"><output class="gpHystV"></output></label>`;
    box.appendChild(d);
    const u = t.gateUi = { d, on: d.querySelector(".gpOn"), thr: d.querySelector(".gpThr"), hyst: d.querySelector(".gpHyst"),
      thrV: d.querySelector(".gpThrV"), hystV: d.querySelector(".gpHystV"), q: d.querySelector(".gq") };
    const set = (patch, rebuild) => { settings.parts[t.label] = { ...partOf(settings, t), ...patch }; settingsChanged(t, rebuild); };
    u.on.onchange = (e) => set({ on: e.target.checked }, false);
    u.thr.oninput = (e) => set({ thr: +e.target.value }, true);
    u.hyst.oninput = (e) => set({ hyst: +e.target.value }, true);
  });
}

function refreshSettingsUi() {
  $("gateOn").checked = settings.gate;
  const f = (v) => (v === 0 ? tr("auto") : (v > 0 ? "+" : "") + v + " dB");
  const odd = [];
  tracks.forEach((t) => {
    const u = t.gateUi;
    if (!u) return;
    const p = partOf(settings, t), tp = partOf(teacherSet, t);
    u.on.checked = p.on !== false;
    u.thr.value = p.thr; u.hyst.value = p.hyst;
    u.thrV.textContent = f(p.thr); u.hystV.textContent = f(p.hyst);
    // the warning is only for parts the teacher has not tuned yet: once values are baked in, nothing looks "strange" any more
    const strange = !!(t.gate.check && tp.thr === 0 && tp.hyst === 0);
    u.q.hidden = !strange;
    if (strange) odd.push(lbl(t.label));
    u.d.classList.toggle("off", !settings.gate || p.on === false);
  });
  $("gateWarn").hidden = !odd.length;
  if (odd.length) $("gateWarn").textContent = tr("unsure", odd.join(", "));
  $("setDot").hidden = !odd.length;
  $("gateBox").hidden = !tracks.some((t) => t.gate);
}

let gateTimer = 0;
const dirty = new Set();
function settingsChanged(t, rebuild) {
  saveSettings(); refreshSettingsUi(); applyMix();
  if (hubMode) markDirty();
  if (!rebuild) return;
  if (t) dirty.add(t); else tracks.forEach((x) => { if (x.gate) dirty.add(x); });
  clearTimeout(gateTimer);
  gateTimer = setTimeout(() => {
    if (!ready) return;
    rebuildGates([...dirty]); dirty.clear();
    if (playing) { const p = position(); engineStop(); engineStart(p); }
    applyMix();
  }, 200);
}
$("gateOn").onchange = (e) => { settings.gate = e.target.checked; settingsChanged(null, false); };

};

const EQ_IDS = ["eqLow", "eqMid", "eqHigh"];
const eqGain = (db) => (db <= -48 ? 0 : Math.pow(10, db / 20));       // the slider's far left means silence, not just very low
function setEq(i, db, save) {
  db = Math.max(-48, Math.min(18, Math.round(db)));
  $(EQ_IDS[i]).value = db;
  $(EQ_IDS[i] + "V").textContent = db <= -48 ? "−∞ dB" : (db > 0 ? "+" : "") + db + " dB";
  if (eqNodes) eqNodes[i].gain.setTargetAtTime(eqGain(db), ctx.currentTime, 0.015);
  if (save !== false) try { localStorage.setItem("stems-eq", JSON.stringify(EQ_IDS.map((id) => +$(id).value))); } catch (e) {}
}
EQ_IDS.forEach((id, i) => {
  $(id).addEventListener("input", (e) => setEq(i, +e.target.value));
  $(id).addEventListener("dblclick", () => setEq(i, 0));
});

function bindWave(div, o) {
  o = o || {};
  const win = o.win || (() => [0, DURATION]);
  let startX = null, rect = null, pid = null, mode = null, edge = 0, w0 = null;
  const toTime = (x) => { const [a, b] = w0 || win(); return a + Math.max(0, Math.min(1, (x - rect.left) / rect.width)) * (b - a); };
  const reset = () => { startX = null; pid = null; mode = null; w0 = null; dragSel = null; };
  div.addEventListener("pointerdown", (e) => {
    if (pid !== null) return;                                   // a second finger is ignored while one is dragging
    pid = e.pointerId; rect = div.getBoundingClientRect(); startX = e.clientX; dragSel = null; mode = null; w0 = win();
    if (o.handles && loop && !loopLocked) {                     // a grip: the nearest edge within a thumb's width
      const [a, b] = w0, xa = rect.left + ((loop[0] - a) / (b - a)) * rect.width, xb = rect.left + ((loop[1] - a) / (b - a)) * rect.width;
      const da = Math.abs(e.clientX - xa), db = Math.abs(e.clientX - xb);
      if (Math.min(da, db) <= 22) {
        mode = "edge"; edge = da <= db ? 0 : 1; activeEdge = edge; frozenWin = w0;
        try { div.setPointerCapture(e.pointerId); } catch (err) {}
        updateLoopUi();
      }
    }
  });
  div.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pid || startX === null) return;
    if (mode === "edge") {
      const t = r4(toTime(e.clientX)), l = loop.slice();
      l[edge] = t;
      if (edge === 0) l[0] = Math.min(l[0], l[1] - 0.05); else l[1] = Math.max(l[1], l[0] + 0.05);
      loop = [Math.max(0, r4(l[0])), Math.min(r4(DURATION), r4(l[1]))];
      updateLoopUi();
      return;
    }
    if (Math.abs(e.clientX - startX) < 8) return;
    if (loopLocked && loop) return;
    try { div.setPointerCapture(e.pointerId); } catch (err) {}
    const a = toTime(startX), b = toTime(e.clientX);
    dragSel = [Math.min(a, b), Math.max(a, b)];
  });
  div.addEventListener("pointerup", (e) => {
    if (e.pointerId !== pid || startX === null) return;
    if (mode === "edge") finishEdit();
    else if (dragSel && dragSel[1] - dragSel[0] >= 0.3) { const d = dragSel; dragSel = null; applyLoop(d[0], d[1], true); }
    else if (!dragSel) seek(toTime(e.clientX));
    reset();
  });
  div.addEventListener("pointercancel", (e) => { if (e.pointerId !== pid) return; if (mode === "edge") finishEdit(); reset(); });
}
bindWave(views.home.el);
bindWave(views.loop.el, { win: () => views.loop.win(), handles: true });
bindWave(views.ov.el);

document.querySelectorAll(".tdisp").forEach((btn) => {
  const edge = +btn.dataset.edge, inp = $(edge ? "lpB" : "lpA");
  let cancel = false;
  btn.onclick = () => {
    if (!loop || loopLocked) return;
    activeEdge = edge; updateLoopUi();
    cancel = false; btn.hidden = true; inp.hidden = false; inp.value = loop[edge].toFixed(4); inp.focus(); inp.select();
  };
  inp.addEventListener("blur", () => {
    if (inp.hidden) return;
    inp.hidden = true; btn.hidden = false;
    const v = parseTime(inp.value);
    if (cancel || Number.isNaN(v) || !loop || loopLocked) { updateLoopUi(); return; }
    const l = loop.slice(); l[edge] = v;
    if (!applyLoop(l[0], l[1])) { flash(tr("tooShort")); updateLoopUi(); }
  });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
    else if (e.key === "Escape") { cancel = true; inp.blur(); }
    e.stopPropagation();
  });
});
document.querySelectorAll(".edge").forEach((card) => {
  card.addEventListener("focusin", () => { const e = +card.dataset.edge; if (e !== activeEdge) { activeEdge = e; updateLoopUi(); } });
});
document.querySelectorAll(".arr").forEach((b) => {       // hold to repeat, a little faster the longer it is held
  const edge = +b.dataset.edge, dir = +b.dataset.dir;
  let timer = 0, n = 0, held = false;
  const stop = () => { clearTimeout(timer); if (held) { held = false; finishEdit(); } };
  const rep = () => { stepEdge(edge, dir, true); n++; timer = setTimeout(rep, n > 12 ? 45 : n > 5 ? 70 : 110); };
  b.addEventListener("pointerdown", (e) => {
    if (b.disabled) return;
    e.preventDefault(); held = true; n = 0; activeEdge = edge;
    stepEdge(edge, dir, true);
    timer = setTimeout(rep, 420);
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) => b.addEventListener(ev, stop));
  b.addEventListener("click", (e) => { if (e.detail === 0) stepEdge(edge, dir, false); });   // keyboard
});

  const onLoop = curTab === "loop";
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }

  else if (e.key === "ArrowRight" && e.target.type !== "range") { if (onLoop && loop) stepEdge(activeEdge, 1); else seek(position() + 5); }
  else if (e.key === "l" || e.key === "L") { if (loop) setLoop(!loopOn); }
  else if (e.key === "[") { if (onLoop) setGrain(grainIdx - 1); else setSpeed(speed * 100 - 5); }
  else if (e.key === "]") { if (onLoop) setGrain(grainIdx + 1); else setSpeed(speed * 100 + 5); }
  else if (/^[0-9]$/.test(e.key) && tracks[(+e.key || 10) - 1]) { const t = tracks[(+e.key || 10) - 1]; t.muted = !t.muted; applyMix(); }
