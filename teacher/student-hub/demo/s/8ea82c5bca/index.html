<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #eef0f2; --panel: #ffffff; --fg: #1d2127; --muted: #5d6671; --line: #d6dadf;
  --accent: #a3243b; --accent-fg: #ffffff;
  --display: "Bodoni Moda", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --chip: #1d2127; --mute: #9aa1ab;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --muted: #9aa1ab; --line: #2e3238; --accent: #e0566c; --accent-fg: #15171b; --chip: #e8eaee; }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
main { max-width: 560px; margin: 0 auto; padding: 28px 16px 56px; }
h1 { font: italic 600 clamp(2rem, 9vw, 2.8rem)/1 var(--display); margin: 0 0 6px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 24px; }
.strum { display: inline-block; margin: -12px 0 24px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font: 500 .8rem/1.6 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.top { display: flex; justify-content: flex-end; }
button, .btn { font: inherit; cursor: pointer; }
.lang { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
form { display: grid; gap: 14px; }
label.f { display: grid; gap: 6px; font-weight: 500; }
input[type=password], input[type=text] { font: inherit; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); width: 100%; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--muted); }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); }
.go { min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 1rem; }
.go:disabled { opacity: .6; }
.err { color: var(--accent); font-weight: 500; margin: 0; }
.lista { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.lista a { display: grid; gap: 2px; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: inherit; text-decoration: none; }
.lista a:active { transform: scale(.985); transition: transform 120ms ease-out; }
.lista b { font-weight: 600; }
.lista .m { color: var(--muted); font-size: .88rem; }
@media (hover: hover) and (pointer: fine) { .lista a:hover { border-color: var(--accent); } }
.vuoto { color: var(--muted); }
.invito { margin-top: 28px; padding: 14px 16px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: .92rem; display: flex; gap: 12px; align-items: flex-start; }
.invito p { margin: 0; flex: 1; }
.invito button { min-height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--muted); font-size: 1.2rem; }
.esci { margin-top: 20px; min-height: 44px; border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 0; }
.priv-testo { white-space: pre-line; margin: 0 0 24px; }
.priv-az { display: grid; gap: 10px; }
.sec { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; font-size: 1rem; }
@media (prefers-reduced-motion: reduce) { .lista a:active { transition: none; } }

/* Compiti e libreria */
main.wide { max-width: 860px; }
.tabs { display: flex; gap: 2px; margin: 8px 0 22px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: 0 0 auto; min-height: 46px; padding: 0 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: transparent; color: var(--muted); font: 600 .95rem var(--body); transition: color .15s; }
.tabs button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.wdate { margin: 0 0 14px; font: 500 .8rem var(--mono); color: var(--muted); letter-spacing: .02em; }
.wk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.wcard { min-width: 0; padding: 20px; border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 16px; background: var(--panel); }
.wcard h2 { font: italic 600 1.45rem/1.1 var(--display); margin: 0 0 10px; }
.wcard .ins { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.wcard h3 { margin: 16px 0 8px; font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.wcard .lista { gap: 8px; }
.lgroup h2 { font: italic 600 1.5rem/1.1 var(--display); margin: 28px 0 2px; }
.lgroup:first-child h2 { margin-top: 4px; }
.lgroup > p { margin: 0 0 12px; color: var(--muted); font-size: .92rem; }
.lgrid { display: grid; gap: 10px; }
.ccard { display: grid; grid-template-columns: minmax(0, 168px) 1fr; gap: 16px; align-items: center; width: 100%; padding: 12px; text-align: left; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: inherit; transition: transform .12s cubic-bezier(.23, 1, .32, 1), border-color .15s; }
.ccard:active { transform: scale(.985); }
@media (hover: hover) and (pointer: fine) { .ccard:hover { border-color: var(--accent); } }
.cprev { display: grid; place-items: center; min-height: 92px; padding: 8px 10px; border-radius: 10px; background: #f6f1e6; color: #23211c; overflow: hidden; }
.cprev svg { display: block; height: 80px; width: auto; max-width: 100%; fill: currentColor; }
.cprev.gtr svg { height: 96px; color: #23211c; --muted: #6c675b; --line: #cfc8b6; --fg: #23211c; }
.ctxt { min-width: 0; }
.ctxt b { display: block; font: italic 600 1.25rem/1.15 var(--display); overflow-wrap: anywhere; }
.ctxt span { display: block; margin-top: 4px; color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.ctxt small { display: inline-block; margin-top: 8px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font: 500 .7rem/1.6 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.wcard .ccard { grid-template-columns: minmax(0, 120px) 1fr; padding: 10px; }
.wcard .ccard .ctxt b { font-size: 1.1rem; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: 0 0 8px -6px; padding: 0 12px 0 6px; border: 0; background: transparent; color: var(--muted); font: 500 .95rem var(--body); }
.back:hover { color: var(--accent); }
@media (max-width: 640px) { .wk { grid-template-columns: 1fr; } .ccard { grid-template-columns: minmax(0, 118px) 1fr; gap: 12px; } .cprev svg { height: 66px; } }
@media (prefers-reduced-motion: reduce) { .ccard, .tabs button { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="top"><button class="lang" id="langBtn" type="button"></button></div>

  <section id="gate">
    <h1 data-i="title">Practice stems</h1>
    <p class="sub" data-i="gateSub">Enter your password to see your songs.</p>
    <form id="form" autocomplete="off">
      <label class="f"><span data-i="pw">Password</span>
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go"></label>
      <label class="chk"><input id="keep" type="checkbox" checked><span data-i="keep">Remember me on this device</span></label>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="go" id="open" type="submit" data-i="open">Open</button>
    </form>
  </section>

  <section id="privacy" hidden>
    <h1 data-i="privTitle">Privacy</h1>
    <p class="priv-testo" id="privTesto"></p>
    <div class="priv-az">
      <button class="go" id="privSi" type="button" data-i="privYes">OK</button>
      <button class="sec" id="privNo" type="button" data-i="privNo">No thanks</button>
    </div>
  </section>

  <section id="songs" hidden>
    <h1 id="hello"></h1>
    <p class="strum" id="strum" hidden></p>
    <nav class="tabs" id="tabs" hidden aria-label="Pages">
      <button type="button" id="tWeek" data-pane="week"></button>
      <button type="button" id="tSongs" data-pane="songs"></button>
      <button type="button" id="tLib" data-pane="lib"></button>
    </nav>
    <div id="paneSongs">
      <p class="sub" id="count"></p>
      <ul class="lista" id="list"></ul>
      <p class="vuoto" id="none" hidden data-i="none">No songs yet. Your teacher will add them here.</p>
    </div>
    <div id="paneWeek" hidden></div>
    <div id="paneLib" hidden></div>
    <div id="paneDetail" hidden></div>
    <aside class="invito" id="invito" hidden><p id="invitoTxt"></p><button type="button" id="invitoX" aria-label="OK">✕</button></aside>
    <button class="esci" id="exit" type="button" data-i="exit">Sign out on this device</button>
    <button class="esci" id="privLnk" type="button" hidden data-i="privLnk">Privacy</button>
  </section>
</main>

<script>/* Libreria didattica: lick, voicings e moves. Una sola sede: la usano il portale degli studenti e l'anteprima dell'Hub.
   Il concetto arriva già pronto (lo spartito è inciso a monte da libreria.py): qui si legge, si suona e si segue.
   Concetto con spartito: { id, tipo, titolo, sub, svg, prima, bpm, beats, bar, measures:[[id,q]], notes:[[id,midi,q,dur,[ids legati]]], lo, hi, didattica:[{da,a,titolo,testo}] }
   Voicing di chitarra:   { id, tipo:"voicing", strumento:"chitarra", titolo, accordi:[{nome, corde:[{fret,dito}×6, dalla corda grave]}] } */

/* ---------- funzioni pure (provate in libreria.test.js) ---------- */
const LIB_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const LIB_PIANO = ["A0", "C1", "Ds1", "Fs1", "A1", "C2", "Ds2", "Fs2", "A2", "C3", "Ds3", "Fs3", "A3", "C4", "Ds4", "Fs4", "A4", "C5", "Ds5", "Fs5", "A5", "C6", "Ds6", "Fs6", "A6", "C7", "Ds7", "Fs7", "A7", "C8"];
const LIB_GUITAR = ["D2", "F2", "Gs2", "B2", "D3", "F3", "Gs3", "B3", "D4", "F4", "Gs4", "B4"];
const LIB_OPEN = [40, 45, 50, 55, 59, 64];
const libTuneName = (m) => LIB_NOTE[((m % 12) + 12) % 12];
const libTuning = (c) => (Array.isArray(c.accordatura) && c.accordatura.length === 6 ? c.accordatura : LIB_OPEN);                       // corde della chitarra dalla più grave
const LIB_NOTE = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];

/* "Ds4" → 63 */
function libSampleMidi(file) {
  const m = /^([A-G])(s?)(\d)$/.exec(file);
  return m ? (+m[3] + 1) * 12 + LIB_PC[m[1]] + (m[2] ? 1 : 0) : null;
}
/* il campione più vicino a una nota */
function libPick(midi, files) {
  let best = null, d = 1e9;
  for (const f of files) { const x = Math.abs(libSampleMidi(f) - midi); if (x < d) { d = x; best = f; } }
  return best;
}
/* tastiera: dal Do sotto la nota più grave al Do sopra la più acuta, almeno due ottave */
function libKeyRange(lo, hi) {
  let a = Math.max(24, Math.floor(lo / 12) * 12), b = Math.min(108, Math.ceil((hi + 1) / 12) * 12);
  while (b - a < 24) { if (b < 108) b += 12; else a -= 12; }
  return [a, b];
}
/* posizione (in pixel) di un istante (in quarti), per interpolazione fra i punti [{q, x}] */
function libX(points, q) {
  const n = points.length;
  if (!n) return 0;
  if (q <= points[0].q) return points[0].x;
  if (q >= points[n - 1].q) return points[n - 1].x;
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (points[mid].q <= q) lo = mid; else hi = mid; }
  const span = points[hi].q - points[lo].q || 1;
  return points[lo].x + (q - points[lo].q) * (points[hi].x - points[lo].x) / span;
}
/* le note che suonano all'istante q */
function libActive(notes, q) {
  const on = [];
  for (const n of notes) { if (n[2] > q + 1e-6) break; if (q < n[2] + Math.max(n[3], 0.12) - 1e-6) on.push(n); }
  return on;
}
/* indice della prima nota che inizia a q o dopo */
function libFirst(notes, q) {
  let lo = 0, hi = notes.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (notes[m][2] < q - 1e-6) lo = m + 1; else hi = m; }
  return lo;
}
/* a quale battuta appartiene l'istante q (1-based) */
function libBar(measures, q) {
  let b = 1;
  for (let i = 0; i < measures.length; i++) if (measures[i][1] <= q + 1e-6) b = i + 1;
  return b;
}
/* l'intervallo [da, a) di una battuta, in quarti */
function libBarRange(c, bar) {
  const m = c.measures, a = m[bar - 1][1], b = bar < m.length ? m[bar][1] : c.beats;
  return [a, b];
}
/* arpeggio: ritardo in secondi di ogni nota di un gruppo simultaneo, dalla più grave */
function libArp(notes) {
  const delay = new Map(), group = new Map();
  for (const n of notes) { const k = n[2].toFixed(3); (group.get(k) || group.set(k, []).get(k)).push(n); }
  for (const g of group.values()) g.slice().sort((a, b) => a[1] - b[1]).forEach((n, i) => delay.set(n[0], i * 0.055));
  return delay;
}
const libMidiName = (m) => LIB_NOTE[m % 12] + (Math.floor(m / 12) - 1);

/* ---------- stile ---------- */
function libStyle() {
  if (typeof document === "undefined" || document.getElementById("lib-style")) return;
  const st = document.createElement("style");
  st.id = "lib-style";
  st.textContent = `
.lib { --lib-paper: #f6f1e6; --lib-ink: #23211c; margin: 0; }
.lib-head h3 { margin: 0; font-family: var(--display, serif); font-style: italic; font-weight: 600; font-size: clamp(1.5rem, 4.2vw, 2.1rem); line-height: 1.05; text-wrap: balance; }
.lib-head p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.lib-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 10px; }
.lib-play { min-height: 46px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-fg, #fff); font: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 9px; cursor: pointer; transition: transform 0.12s var(--ease-out, ease-out), filter 0.15s; }
.lib-play:active { transform: scale(0.97); }
.lib-play:disabled { filter: saturate(0.4); cursor: progress; }
.lib-play svg { width: 16px; height: 16px; fill: currentColor; }
.lib-chip { min-height: 40px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg); font: inherit; font-size: 0.88rem; cursor: pointer; transition: transform 0.12s var(--ease-out, ease-out), border-color 0.15s, color 0.15s; }
.lib-chip:active { transform: scale(0.97); }
.lib-chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.lib-sep { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); }
.lib-info { margin-left: auto; font-family: var(--mono, monospace); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lib-status { min-height: 1.3em; margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); }
.lib-status.err { color: var(--accent); }
.lib-score { position: relative; overflow-x: auto; border-radius: 14px; background: var(--lib-paper); color: var(--lib-ink); -webkit-overflow-scrolling: touch; border: 1px solid rgba(0, 0, 0, 0.08); }
.lib-inner { position: relative; display: inline-block; min-width: 100%; vertical-align: top; }
.lib-inner svg { display: block; height: 190px; width: auto; fill: currentColor; padding: 10px 6px 6px; box-sizing: content-box; }
.lib-score.is-fit .lib-inner { display: block; }
.lib-score.is-fit .lib-inner svg { width: 100%; height: auto; box-sizing: border-box; }
.lib-score.is-big .lib-inner svg { height: 240px; }
@media (max-width: 560px) { .lib-inner svg { height: 150px; } .lib-score.is-big .lib-inner svg { height: 190px; } }
.lib-inner { cursor: pointer; }
.lib-inner svg g.note.lib-on, .lib-inner svg g.note.lib-on * { fill: var(--accent); stroke: var(--accent); }
.lib { --lh: #3f78b5; }
.lib-inner svg g.note.lib-on-s, .lib-inner svg g.note.lib-on-s * { fill: var(--lh); stroke: var(--lh); }
.lib-keys .w.on.sx { background: var(--lh); }
.lib-keys .b.on.sx { background: color-mix(in srgb, var(--lh) 80%, #000); }
.lib-keys .w.mc i { color: var(--accent); font-weight: 800; }
.lib-keys .w.mc::before { content: ""; position: absolute; left: 50%; bottom: 20px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--accent); }
.lib-keys .w.mc.on::before, .lib-keys .w.mc.on i { background: #fff; color: #fff; }
.lib-keys .w.mc.on i { background: none; }
.lib-no-rn svg .lib-rn { display: none; }
.lib-inner svg .lib-rn { font-family: var(--serif, Georgia, "Times New Roman", serif); font-style: italic; font-weight: 400; fill: #8f897b; stroke: none; pointer-events: none; }
.lib-no-deg svg .lib-degs { display: none; }
.lib-inner svg .lib-deg { font-family: var(--mono, ui-monospace, Menlo, monospace); font-weight: 700; fill: #6b4d52; stroke: none; pointer-events: none; }
.lib-inner svg .lib-deg-g { font-weight: 600; }
.lib-inner svg .lib-deg.lib-on { fill: var(--accent); }
.lib-inner svg .lib-deg.lib-on-s { fill: var(--lh); }
.lib-inner svg .lib-deg-link { stroke: #6b4d52; stroke-opacity: .55; stroke-dasharray: 18 14; pointer-events: none; }
.lib-hands { font: 500 0.72rem var(--mono, monospace); color: var(--muted); margin: 6px 0 0; }
.lib-hands b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
.lib-inner svg g.loop-bar > g.measure { }
.lib-loopmark { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 9%, transparent); border-left: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); border-right: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.lib-playhead { position: absolute; top: 6px; bottom: 6px; width: 2px; margin-left: -1px; background: var(--accent); border-radius: 2px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.lib-playing .lib-playhead, .lib-paused .lib-playhead { opacity: 1; }
.lib-hint { margin: 6px 2px 0; font-size: 0.8rem; color: var(--muted); }
.lib-keys { position: relative; height: 96px; margin-top: 14px; user-select: none; border-radius: 0 0 8px 8px; overflow: hidden; background: #111; padding-top: 2px; }
.lib-keys .w, .lib-keys .b { position: absolute; top: 0; box-sizing: border-box; transition: background-color 0.06s; }
.lib-keys .w { bottom: 0; background: #fbfaf7; border-right: 1px solid #bdb8ac; border-radius: 0 0 4px 4px; }
.lib-keys .b { height: 60%; background: #1b1b1d; z-index: 2; border-radius: 0 0 3px 3px; }
.lib-keys .w.on { background: var(--accent); }
.lib-keys .b.on { background: color-mix(in srgb, var(--accent) 80%, #000); }
.lib-keys .w i { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font: normal 600 9.5px var(--mono, monospace); color: #8a8578; }
.lib-keys .w.on i { color: var(--accent-fg, #fff); }
.lib-notes { margin-top: 16px; display: grid; gap: 8px; }
.lib-note { padding: 10px 14px; border-left: 3px solid var(--line); border-radius: 2px 10px 10px 2px; background: color-mix(in srgb, var(--fg) 4%, transparent); transition: border-color 0.2s, background-color 0.2s; }
.lib-note.on { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.lib-note b { display: block; font-size: 0.95rem; }
.lib-note small { font-family: var(--mono, monospace); color: var(--muted); font-size: 0.72rem; margin-left: 6px; font-weight: 400; }
.lib-note p { margin: 3px 0 0; font-size: 0.92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.lib-credit { margin: 14px 0 0; font-size: 0.72rem; color: var(--muted); }

const PASSPARTOUT = null;
async function openWithPassword(password, openRegular, owner, pageSalt, decodeBase64) {
  if (!password) return null;
  try {
    return await openRegular(password);
  } catch (error) {
    if (!owner) return null;
  }
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({
      name: "PBKDF2", salt: decodeBase64(owner.salt), iterations: owner.iterations, hash: "SHA-256"
    }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const wrapped = decodeBase64(owner.wrapped);
    const regular = await crypto.subtle.decrypt({
      name: "AES-GCM", iv: wrapped.subarray(0, 12), additionalData: decodeBase64(pageSalt)
    }, key, wrapped.subarray(12));
    return await openRegular(new TextDecoder().decode(regular));
  } catch (error) {
    return null;
  }
}

  $("tWeek").textContent = tr("tWeek"); $("tSongs").textContent = tr("tSongs"); $("tLib").textContent = tr("tLib");
  /* questa settimana */
  const wk = $("paneWeek"); wk.replaceChildren();
  if (w) {
    const d = document.createElement("p"); d.className = "wdate";
    d.textContent = new Intl.DateTimeFormat(LANG, { dateStyle: "long", timeZone: "UTC" }).format(new Date(w.data));
    const grid = document.createElement("div"); grid.className = "wk";
    for (const tipo of ["longform", "brushing"]) {
      const card = document.createElement("article"); card.className = "wcard";
      const h = document.createElement("h2"); h.textContent = tr(tipo);
      const ins = document.createElement("p"); ins.className = "ins"; ins.textContent = w[tipo].istruzioni;
      card.append(h, ins);
      const songs = (w[tipo].brani || []).map((sl) => DATA.brani.find((b) => b.slug === sl)).filter(Boolean);
      if (songs.length) { const h3 = document.createElement("h3"); h3.textContent = tr("wSongs"); const ul = document.createElement("ul"); ul.className = "lista"; songs.forEach((b) => ul.append(songLink(b))); card.append(h3, ul); }
      const lib = (w[tipo].concetti || []).map((id) => cs.find((c) => c.id === id)).filter(Boolean);
      if (lib.length) { const h3 = document.createElement("h3"); h3.textContent = tr("wConcepts"); const box = document.createElement("div"); box.className = "lgrid"; lib.forEach((c) => box.append(conceptCard(c, "week"))); card.append(h3, box); }
      grid.append(card);
    }
    wk.append(d, grid);
  }
  /* libreria */
  const lb = $("paneLib"); lb.replaceChildren();
  for (const tipo of ["lick", "voicing", "move"]) {
    const items = cs.filter((c) => c.tipo === tipo); if (!items.length) continue;
    const g = document.createElement("section"); g.className = "lgroup";
    const T = tipo[0].toUpperCase() + tipo.slice(1);
    const h = document.createElement("h2"); h.textContent = tr("g" + T);
    const sb = document.createElement("p"); sb.textContent = tr("g" + T + "Sub");
    const box = document.createElement("div"); box.className = "lgrid";
    items.forEach((c) => box.append(conceptCard(c, "lib")));
    g.append(h, sb, box); lb.append(g);
  }
  const ok = (n) => n === "songs" || (n === "week" && w) || (n === "lib" && cs.length);
  if (!learnSeen) { learnSeen = true; pane = w ? "week" : "songs"; }
  showPane(ok(pane) ? pane : "songs");
}
for (const b of document.querySelectorAll("#tabs button")) b.onclick = () => showPane(b.dataset.pane);
/* ---- Misurazione d'uso ---- */
const TK = "stems-trk:" + CODE, PK = "stems-privacy:" + CODE;      // TK = 1 se questo dispositivo può essere misurato (lo legge anche il player)
const memo = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; };
function trkStato() {                      // "si" misura · "no" non misura · "chiedi" serve la risposta dello studente
  if (TRK.modo === "test") return (TRK.codici || []).includes(CODE) ? "si" : "no";
  if (TRK.modo === "optin") { const r = memo(PK); return r === TRK.ver + ":si" ? "si" : r === TRK.ver + ":no" ? "no" : "chiedi"; }
  return "no";
}
function trkInvia(t, extra) {
  if (memo(TK) !== "1") return;
  try {
    const corpo = JSON.stringify(Object.assign({ c: CODE, t: t, v: TRK.modo === "optin" ? TRK.ver : "" }, extra || {}));
    const ok = navigator.sendBeacon && navigator.sendBeacon("/api/e", new Blob([corpo], { type: "text/plain" }));
    if (!ok) fetch("/api/e", { method: "POST", body: corpo, keepalive: true, headers: { "Content-Type": "text/plain" } }).catch(() => {});
  } catch (e) {}
}
function privTesto() { $("privTesto").textContent = (TRK.testo && TRK.testo[LANG]) || tr("privTxt"); }
function privScelta(si) {
  memo(PK, TRK.ver + (si ? ":si" : ":no")); memo(TK, si ? "1" : null);
  if (si) trkInvia("optin");
  $("privacy").hidden = true; mostra(DATA);
}
$("privSi").onclick = () => privScelta(true);
$("privNo").onclick = () => privScelta(false);
$("privLnk").onclick = () => { memo(PK, null); memo(TK, null); $("songs").hidden = true; $("privacy").hidden = false; privTesto(); };

function show(data) {
  DATA = data;
  const st = trkStato();
  memo(TK, st === "si" ? "1" : null);
  if (st === "chiedi") { $("gate").hidden = true; $("privacy").hidden = false; privTesto(); return; }
  mostra(data);
}
function mostra(data) {
  DATA = data;
  $("gate").hidden = true; $("songs").hidden = false;
  $("privLnk").hidden = TRK.modo !== "optin";
  renderSongs();
  trkInvia("apri");
  const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  let seen = false; try { seen = localStorage.getItem("stems-invito") === "1"; } catch (e) {}
  const ua = navigator.userAgent || "", ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  if (!standalone && !seen && (ios || android)) { $("invitoTxt").textContent = tr(ios ? "ios" : "android"); $("invito").hidden = false; }
}
$("invitoX").onclick = () => { $("invito").hidden = true; try { localStorage.setItem("stems-invito", "1"); } catch (e) {} };
$("exit").onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("pw").value;
  $("open").disabled = true; $("open").textContent = tr("opening");
  const d = await unlock(pw);
  $("open").disabled = false; $("open").textContent = tr("open");
  if (!d) { $("err").hidden = false; $("err").textContent = tr("bad"); $("pw").select(); return; }
  try { if ($("keep").checked) localStorage.setItem(KEY, d.pw); else localStorage.removeItem(KEY); } catch (e2) {}
  show(d.data);
});

LANG = pickLang(); applyLang();
(async () => {
  if (!window.crypto || !crypto.subtle) { $("err").hidden = false; $("err").textContent = tr("needHttps"); $("open").disabled = true; return; }
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  // «Apri ambiente» dall'Hub: la password arriva nel frammento (#p=…), che non viene mai inviato al server; la togliamo subito dall'indirizzo
  const hm = /[#&]p=([^&]*)/.exec(location.hash); let daHub = false;
  if (hm) { try { saved = decodeURIComponent(hm[1]); daHub = true; } catch (e) {} try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  const d = await unlock(saved);
  if (d) { if (daHub || d.pw !== saved) { try { localStorage.setItem(KEY, d.pw); } catch (e) {} } show(d.data); }
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {});
